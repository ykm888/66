name: Vidara Full-Auto Pipeline V3

on:
  schedule:
    - cron: '0 0 * * *' # 每日午夜自动执行
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Workflow Environment
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install yt-dlp playwright
          playwright install chromium
      
      - name: Fetch High-Quality Video
        run: |
          # 抓取逻辑：优先选择MP4，确保时长大于60秒，排除已抓取文件
          yt-dlp --match-filter "duration > 60" \
                 -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]" \
                 -o "target_video.mp4" \
                 "https://www.douyin.com/discover"
      
      - name: Execute Upload to Vidara
        env:
          VIDARA_USER: ${{ secrets.VIDARA_USER }}
          VIDARA_PASS: ${{ secrets.VIDARA_PASS }}
        run: |
          python3 -c "
          import sys
          import random
          import time
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              
              # 访问登录页并进行登录
              page.goto('https://vidara.so/login')
              page.fill('input[name=\"username\"]', '${{ secrets.VIDARA_USER }}')
              page.fill('input[name=\"password\"]', '${{ secrets.VIDARA_PASS }}')
              page.click('button[type=\"submit\"]')
              
              # 等待页面加载，设置随机延迟避免触发反爬虫
              time.sleep(random.uniform(5, 10))
              
              # 跳转上传页并上传
              page.goto('https://vidara.so/upload')
              page.set_input_files('input[type=\"file\"]', 'target_video.mp4')
              
              # 自动填写标题并发布
              page.fill('input[placeholder=\"Title\"]', 'Daily High-Quality Content #' + str(random.randint(1000, 9999)))
              page.click('button#publish')
              
              time.sleep(10)
              browser.close()"
