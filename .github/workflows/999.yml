name: Vidara Full-Auto Pipeline V6

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  automation_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U yt-dlp playwright
          playwright install chromium

      - name: Fetch Video via Cloud Search
        run: |
          yt-dlp "ytsearch1:抖音 1分钟以上" \
            --match-filter "duration > 60 & duration < 300" \
            --no-playlist \
            -f "mp4" \
            -o "target_video.mp4"
          if [ ! -f target_video.mp4 ]; then exit 1; fi

      - name: Automated Upload to Vidara
        env:
          VIDARA_USER: ${{ secrets.VIDARA_USER }}
          VIDARA_PASS: ${{ secrets.VIDARA_PASS }}
        # 修复核心：使用 | 符号确保内部 Python 代码不被 YAML 解析器误读
        run: |
          python3 << 'EOF'
          import sys, time, random
          from playwright.sync_api import sync_playwright
          import os

          def run_upload():
              user = os.getenv("VIDARA_USER")
              pw = os.getenv("VIDARA_PASS")
              
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  context = browser.new_context(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36')
                  page = context.new_page()

                  # 1. 登录流程
                  page.goto('https://vidara.so/login')
                  page.fill('input[name="username"]', user)
                  page.fill('input[name="password"]', pw)
                  page.click('button[type="submit"]')
                  time.sleep(5)

                  # 2. 上传流程
                  page.goto('https://vidara.so/upload')
                  page.set_input_files('input[type="file"]', 'target_video.mp4')
                  time.sleep(10)

                  # 3. 发布
                  title = f"Daily-Vlog-{random.randint(100, 999)}"
                  page.fill('input[placeholder*="Title"]', title)
                  page.click('button#publish')
                  
                  time.sleep(30)
                  print('Process Completed Successfully')
                  browser.close()

          if __name__ == '__main__':
              run_upload()
          EOF
