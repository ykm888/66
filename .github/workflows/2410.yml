name: Source Physics Mirror (No Build)

on:
  workflow_dispatch: # 手动触发

jobs:
  mirror_source:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予写入权限以创建分支

    steps:
      - name: 1. 物理检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 物理克隆上游仓库 (MT7981 专项源)
        run: |
          # 设定上游地址与目标分支名称
          UPSTREAM_URL="https://github.com/padavanonly/immortalwrt-mt798x-24.10.git"
          UPSTREAM_BRANCH="2410"
          NEW_BRANCH="sl3000-physics-base"

          # 物理隔离：在临时目录进行同步
          git clone --depth 1 -b $UPSTREAM_BRANCH $UPSTREAM_URL upstream_sync
          cd upstream_sync

          # 重置 Git 标识
          git remote remove origin
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          
          # 物理推送：创建并强制推送到你的新分支
          git checkout -b $NEW_BRANCH
          git push -f origin $NEW_BRANCH

      - name: 3. 物理确认
        run: echo "物理同步完成！源码已存入分支：sl3000-physics-base"
