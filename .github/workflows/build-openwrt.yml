name: SL3000-512M-Final-Build

on:
  workflow_dispatch: # 手动点击 Actions 运行
  push:
    tags: [ 'v*' ] # 推送 v 开头的标签自动运行

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # 物理授权：必须开启才能自动创建 Release 发布固件
    
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          # 建议根据你实际的底层仓库修改这里
          repository: ykm888/66
          ref: 2410
          path: source-repo

      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean
          # 释放 Ubuntu 虚拟机的物理空间，确保编译顺利

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Run diy-part1.sh (Environment & Base Setup)
        run: |
          chmod +x main-repo/diy-part1.sh
          # 物理隔离：在根目录运行脚本，内部处理目录跳转
          ./main-repo/diy-part1.sh
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Run diy-part2.sh (Full Compilation)
        run: |
          chmod +x main-repo/diy-part2.sh
          ./main-repo/diy-part2.sh
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Generate Release Tag
        id: tag
        run: |
          echo "release_tag=SL3000-512M-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

      - name: Upload Firmware to Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: SL3000 512M 救砖专用固件 [${{ steps.tag.outputs.release_tag }}]
          body: |
            ### 🛠️ 构建说明
            - **底层仓库**: ykm888/66 (Linux 5.4)
            - **内存限制**: 物理锁定 512MB RAM
            - **核心组件**: MMC, F2FS, USB3.0, KSMBD, TTYD
            - **校验信息**: 每个固件均附带 .md5 校验文件
          files: output/firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sl3000-firmware-backup
          path: output/firmware/
