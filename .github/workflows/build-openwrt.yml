name: Build SL-3000 Firmware (23.05 Physical Sync)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  CONFIG_FILE: 888/sl3000.config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Command Center
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Initialization Environment
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo timedatectl set-timezone "$TZ"

    - name: Clone Foundation & Merge 888
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        # 物理溯源：确保 888 零件仓库完整复制到 openwrt 根目录
        cp -r 888 openwrt/
        cp $DIY_P2_SH openwrt/

    - name: Update & Install Feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Physical Stitching & Hardening
      working-directory: ./openwrt
      run: |
        chmod +x $DIY_P2_SH
        ./$DIY_P2_SH
        
        # 准则 3 物理自检：确认零件是否物理就位
        [ -f "package/boot/arm-trusted-firmware-mediatek/Makefile" ] || { echo "ATF Makefile Missing!"; exit 1; }
        grep -q "FIP_BASE" 888/bl2_dev_spi_nor.c || { echo "BL2 Patch Missing!"; exit 1; }
        
        make defconfig

    - name: Compile Firmware
      working-directory: ./openwrt
      run: |
        make download -j8
        # 最小物理修补：优先编译引导零件，确保日志清晰
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j$(nproc)
        make package/boot/uboot-mediatek/compile V=s -j$(nproc)
        # 执行全局编译
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000_Firmware
        path: |
          openwrt/bin/targets/mediatek/filogic/*nor-programmer-dump.bin
          openwrt/bin/targets/mediatek/filogic/*emmc-sysupgrade.bin
