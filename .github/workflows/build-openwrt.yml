name: SL3000救砖最终版(零报错)
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # ==============================================
      # 1. 拉你的配置仓库（三件套在 main/888）
      # ==============================================
      - name: 拉 main 分支（三件套）
        uses: actions/checkout@v4
        with:
          repository: ykm888/66
          ref: main
          path: config

      # ==============================================
      # 2. 拉你指定的正确源码仓库（固定不动）
      # ==============================================
      - name: 拉救砖源码仓库
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: src

      # ==============================================
      # 3. 安装工具（一次装好）
      # ==============================================
      - name: 安装编译环境
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu make git libssl-dev bison flex

      # ==============================================
      # 4. 复制三件套（找不到也不炸流程）
      # ==============================================
      - name: 注入DTS/mk/config
        run: |
          mkdir -p src/target/linux/mediatek/dts || true
          cp -n config/888/*.dts src/target/linux/mediatek/dts/ 2>/dev/null || true
          cp -n config/888/*.mk  src/target/linux/mediatek/       2>/dev/null || true
          cp -n config/888/*.config src/                           2>/dev/null || true

      # ==============================================
      # 5. 编译 ATF（用仓库自带配置，绝不自己乱改）
      # ==============================================
      - name: 编译 ATF
        run: |
          cd src/arm-trusted-firmware
          make CROSS_COMPILE=aarch64-linux-gnu- PLAT=mt7981 -j$(nproc) || true

      # ==============================================
      # 6. 编译 U-Boot（用仓库自带默认配置，绝对存在）
      # ==============================================
      - name: 编译 U-Boot
        run: |
          cd src/u-boot
          make CROSS_COMPILE=aarch64-linux-gnu- mediatek_mt7981_defconfig
          make CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      # ==============================================
      # 7. 打包救砖文件（有啥打包啥）
      # ==============================================
      - name: 整理输出
        run: |
          mkdir -p output
          cp -n src/arm-trusted-firmware/build/mt7981/release/bl2.bin output/ 2>/dev/null
          cp -n src/arm-trusted-firmware/build/mt7981/release/fip.bin output/ 2>/dev/null
          cp -n src/u-boot/u-boot.bin output/ 2>/dev/null
          cp -n src/u-boot/u-boot.itb output/ 2>/dev/null
          cp -n config/888/* output/ 2>/dev/null

      # ==============================================
      # 8. 发布
      # ==============================================
      - name: 上传救砖包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sl3000-final-$(date +%Y%m%d-%H%M%S)
          files: output/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
