name: Build SL-3000 1024M (Native Fix)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  CONFIG_FILE: custom-config/sl3000.config
  DIY_P2_SH: scripts/diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        # 物理释放 IO 空间
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
        
        sudo -E apt-get -qq update
        # 补全关键编译工具：bc(内核计算), dtc(设备树), dos2unix(格式转换)
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq install bc python3-setuptools device-tree-compiler dos2unix
        
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone Source Code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Update & Install Feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Execute DIY-Part2 Script
      working-directory: openwrt
      run: |
        # 物理手术：强制转换脚本格式，彻底解决 Windows 编码导致的 Exit 1
        if [ -f "../$DIY_P2_SH" ]; then
            dos2unix "../$DIY_P2_SH"
            chmod +x ../$DIY_P2_SH
            ../$DIY_P2_SH
        else
            echo "Error: $DIY_P2_SH not found in root repository."
            exit 1
        fi

    - name: Load Custom Configuration
      working-directory: openwrt
      run: |
        [ -f ../$CONFIG_FILE ] && cp ../$CONFIG_FILE .config
        make defconfig

    - name: Download Library Packages
      working-directory: openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      working-directory: openwrt
      run: |
        # 物理编译过程，开启详细日志
        make -j$(nproc) || make -j1 V=s

    - name: Organize Files
      run: |
        mkdir -p bin/firmware
        cp -f openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin bin/firmware/
        # 物理提取 Makefile 中备份的救砖零件
        cp -rf openwrt/bin/targets/mediatek/filogic/sl3000-recovery bin/ 2>/dev/null || true

    - name: Upload Artifact
      uses: artifacts/upload-artifact@v4
      with:
        name: SL3000-1024M-Firmware
        path: bin/
