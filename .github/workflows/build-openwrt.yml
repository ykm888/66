name: "SL3000-Final-Repair-Build-V76"

on:
  workflow_dispatch: # 手动物理触发

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理环境初始化与空间清理 (工序一)
        run: |
          # 物理腾出空间，防止编译 toolchain 时因磁盘满导致文件丢失
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig libpython3-dev qemu-utils libncursesw5-dev liblzma-dev libpam0g-dev libglib2.0-dev libgpiod-dev device-tree-compiler bc python3-yaml python3-setuptools
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: 2. 物理克隆源码 (工序二)
        run: |
          # 物理检出包含修复 DTS/MK 的开发分支
          git clone --depth 1 -b sl3000-immortalwrt-bootstrap https://github.com/ykm888/66 openwrt

      - name: 3. 物理同步 Feeds (工序三)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4. 物理注入 5.15 DTS 与 32MB 救砖逻辑 (工序四)
        run: |
          cd openwrt
          # 物理确保 5.15 内核路径绝对存在
          mkdir -p target/linux/mediatek/files-5.15/arch/arm64/boot/dts/mediatek/
          
          # 物理同步 DTS (如果开发分支路径不同，强制复制到编译路径)
          [ -f target/linux/mediatek/files-5.15/arch/arm64/boot/dts/mediatek/mt7981-sl-3000-emmc.dts ] || \
          cp target/linux/mediatek/dts/mt7981-sl-3000-emmc.dts target/linux/mediatek/files-5.15/arch/arm64/boot/dts/mediatek/ 2>/dev/null || true

          # 物理重写 MK 救砖包逻辑
          sed -i '/Device\/sl_3000-nor-emmc/,/endef/d' target/linux/mediatek/image/filogic.mk
          cat << 'EOF' >> target/linux/mediatek/image/filogic.mk

          define Build/sl3000-nor-bundle
          	rm -f $@.nor
          	dd if=$(STAGING_DIR_IMAGE)/mt7981-nor-ddr4-bl2.img of=$@.nor bs=1k conv=notrunc
          	dd if=$(STAGING_DIR_IMAGE)/mt7981_sl_3000-nor-fip.bin of=$@.nor bs=1k seek=1024 conv=notrunc
          	truncate -s 32M $@.nor
          	cp $@.nor $@
          endef

          define Device/sl_3000-nor-emmc
            DEVICE_VENDOR := SL
            DEVICE_MODEL := 3000
            DEVICE_VARIANT := NOR-1024M-Rescue-V76
            DEVICE_DTS := mt7981-sl-3000-emmc
            IMAGES := nor-programmer-dump.bin emmc-sysupgrade.bin
            IMAGE/nor-programmer-dump.bin := sl3000-nor-bundle
            IMAGE/emmc-sysupgrade.bin := append-kernel | pad-to 64M | append-rootfs | append-metadata
          endef
          EOF

      - name: 5. 物理加载 8000 行配置与预下载 (工序五)
        run: |
          cd openwrt
          # 从 main 分支物理提取 8000 行全量配置
          curl -sL https://raw.githubusercontent.com/ykm888/66/main/custom-config/sl3000.config -o .config
          echo "CONFIG_LINUX_5_15=y" >> .config
          make defconfig
          # 物理下载源码，防止编译中途因网络中断
          make download -j8

      - name: 6. 物理修复编译：工具链优先 (工序六)
        run: |
          cd openwrt
          # 先物理安装工具链，解决 ld-musl 缺失报错
          make tools/install -j$(nproc) || make tools/install V=s -j1
          make toolchain/install -j$(nproc) || make toolchain/install V=s -j1
          
          # 物理编译引导组件
          make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
          make package/boot/uboot-mediatek/compile V=s -j1
          
          # 全量物理构建
          make -j$(nproc) || make -j1 V=s

      - name: 7. 物理产出物搜集 (工序七)
        run: |
          cd openwrt
          mkdir -p out_final
          find bin/targets/mediatek/filogic/ -name "*nor-programmer-dump.bin*" -exec cp -v {} out_final/ \;
          find bin/targets/mediatek/filogic/ -name "*emmc-sysupgrade.bin*" -exec cp -v {} out_final/ \;
          [ -d out_final ] && cd out_final && sha256sum * > sha256sums.txt

      - name: 8. 上传 1024M 物理救砖固件 (工序八)
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-V76-Rescue-Package
          path: openwrt/out_final/
