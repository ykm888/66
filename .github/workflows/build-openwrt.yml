name: Build SL-3000 1024M (Native Fix)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  CONFIG_FILE: custom-config/sl3000.config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Clone Source Code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Update & Install Feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration
      working-directory: openwrt
      run: |
        # 物理移动你的 1024M 配置文件
        [ -f ../$CONFIG_FILE ] && cp ../$CONFIG_FILE .config
        # 执行源头对齐：由于 Makefile 已修复，此处只需生成最终 .config
        make defconfig

    - name: Download Library Packages
      working-directory: openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      working-directory: openwrt
      run: |
        # 开启详细日志，以便观察我们刚才注入的 Makefile 手术是否生效
        make -j$(nproc) || make -j1 V=s

    - name: Organize Files
      run: |
        mkdir -p bin/firmware
        # 提取最终生成的 sysupgrade 固件
        cp -f openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin bin/firmware/
        # 提取我们在 Makefile 中专门物理备份的救砖零件
        cp -rf openwrt/bin/targets/mediatek/filogic/sl3000-recovery bin/ 2>/dev/null || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-1024M-Firmware
        path: bin/
