name: 司洛SL-3000 EMMC 终极版

on:
  workflow_dispatch:

env:
  # 源码工地：克隆你的官方源码分支
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  # 零件路径：都在 main 分支的 888 目录下
  CONFIG_FILE: 888/sl3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 检出零件 (Checkout main branch)
      uses: actions/checkout@v4
      with:
        ref: main # 确保先拿到 main 分支的 888 文件夹和脚本

    - name: 2. 初始化编译环境 (Initialization)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 3. 克隆源码工地 (Clone bootstrap source)
      working-directory: /workdir
      run: |
        # 克隆 bootstrap 分支作为工地
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 4. 物理对齐：注入补丁与脚本 (Part 1)
      run: |
        # 此时零件就在 $GITHUB_WORKSPACE (由 Step 1 检出)
        # 物理注入 DTS 和 MK (从 888 文件夹)
        find openwrt/target/linux/mediatek/ -type d -name "dts" -exec cp -f 888/mt7981-sl-3000-emmc.dts {} \;
        [ -f 888/filogic.mk ] && cp -f 888/filogic.mk openwrt/target/linux/mediatek/image/
        
        # 执行脚本 1
        chmod +x $DIY_P1_SH
        ./$DIY_P1_SH
        
    - name: 5. 更新与安装 Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        # 物理清理索引，确保识别源码自带的 uboot/atf
        rm -rf tmp

    - name: 6. 物理对齐：加载配置与脚本 (Part 2)
      run: |
        # 强制移动 888 里的配置文件到工地
        [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config
        
        # 执行脚本 2
        chmod +x $DIY_P2_SH
        ./$DIY_P2_SH

    - name: 7. 预下载依赖包 (Download)
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 8. 正式编译 (Compile)
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        # 针对 Mediatek 建议优先全量编译，报错则单线程 V=s
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 9. 整理输出文件 (Organize)
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        # 专门针对 SL3000 的 32M/512M 提取逻辑可以写在这里
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 10. 上传固件 (Artifact)
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: SL3000_ImmortalWrt_Firmware
        path: ${{ env.FIRMWARE }}/*.bin
