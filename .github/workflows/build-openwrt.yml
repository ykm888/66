name: 司洛SL-3000 终极锁死版

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  CONFIG_FILE: 888/sl3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 物理锁死：检出零件 (Main)
      uses: actions/checkout@v4
      with:
        ref: main

    - name: 2. 物理锁死：检出工地 (Bootstrap Source)
      run: |
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH /workdir/openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 3. 初始化环境
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig libpython3-dev command-not-found help2man qemu-utils device-tree-compiler
        sudo timedatectl set-timezone "$TZ"

    - name: 4. 执行 DIY-Part1 & Feeds 更新
      run: |
        chmod +x $DIY_P1_SH
        ./$DIY_P1_SH
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 5. 【核心手术】物理切断 Feeds 干扰
      run: |
        cd openwrt
        # 物理删除所有可能干扰 package/boot 的 Feeds 软链接
        rm -rf package/feeds/mediatek/arm-trusted-firmware-mediatek
        rm -rf package/feeds/mediatek/uboot-mediatek
        # 物理核对：如果我生成的 Makefile 不在，直接熔断
        if [ ! -f "package/boot/arm-trusted-firmware-mediatek/Makefile" ]; then
          echo "FATAL: Makefile not found in package/boot/"
          exit 1
        fi
        # 物理重置索引缓存
        rm -rf tmp
        echo "Index reset complete. System forced to use local package/boot."

    - name: 6. 加载配置 & 执行 DIY-Part2
      run: |
        # 将 main 的 888 配置物理覆盖到工地
        cp -f $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        ./$DIY_P2_SH
        # 强制执行 defconfig 刷新依赖
        cd openwrt && make defconfig

    - name: 7. 下载依赖 & 编译 (熔断保护)
      run: |
        cd openwrt
        make download -j8
        # 物理锁定：如果编译失败，打印最后 100 行错误并停止
        make -j$(nproc) || make -j1 V=s

    - name: 8. 成果输出
      run: |
        mkdir -p bin/firmware
        find openwrt/bin/targets/ -name "*.bin" -exec cp -f {} bin/firmware/ \;
