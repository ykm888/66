name: Build SL-3000 Firmware (23.05 Physical Sync)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  # 物理溯源：使用你的核心 bootstrap 分支作为 23.05 地基
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 888/sl3000.config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Command Center (888 Parts)
      uses: actions/checkout@v4
      with:
        ref: main # 从 main 分支提取你的 888 零件仓库

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone Foundation & Merge 888
      run: |
        # 1. 克隆 23.05 源码地基
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        
        # 2. 物理全量注入：将 888 目录及脚本搬运至源码根目录
        cp -r 888 openwrt/
        cp $DIY_P2_SH openwrt/

    - name: Update & Install Feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Physical Stitching & Hardening (核心注入)
      working-directory: ./openwrt
      run: |
        # 1. 执行物理搬运脚本 (覆盖 Makefile、注入驱动补丁、修正偏移)
        chmod +x $DIY_P2_SH
        ./$DIY_P2_SH || { echo "!!! DIY-Part2 Physical Break !!!"; exit 1; }

        # 2. 物理强推：将 sl3000.config 覆盖为当前 .config
        cp -f 888/sl3000.config .config
        
        # 3. 物理冗余锁定：强制追加关键依赖，防止被 feeds 或 defconfig 剔除
        # 锁定 32M 闪存分区，绝对禁止溢出
        sed -i '/CONFIG_TARGET_ROOTFS_PARTSIZE/d' .config
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=24" >> .config
        
        # 锁定 ATF 和 U-Boot 的物理变体
        echo "CONFIG_PACKAGE_arm-trusted-firmware-mediatek=y" >> .config
        echo "CONFIG_PACKAGE_arm-trusted-firmware-mediatek-mt7981-nor-ddr4=y" >> .config
        echo "CONFIG_PACKAGE_uboot-mediatek=y" >> .config
        echo "CONFIG_PACKAGE_uboot-mediatek-mt7981_sl3000_nor=y" >> .config
        
        # 4. 执行 defconfig 并再次物理校验核心零件
        make defconfig
        grep -q "CONFIG_PACKAGE_arm-trusted-firmware-mediatek-mt7981-nor-ddr4=y" .config || { echo "!!! ATF Missing after defconfig !!!"; exit 1; }

    - name: Compile Firmware (The Great Wall)
      working-directory: ./openwrt
      run: |
        make download -j8
        # 并行编译失败后自动切入单核 V=s 输出详细物理报错日志
        make -j$(nproc) || make -j1 V=s || { echo "!!! Compilation Failed !!!"; exit 1; }

    - name: Organize Files & Physical Check
      working-directory: ./openwrt
      run: |
        mkdir -p bin/targets/mediatek/filogic/救砖专用/
        # 物理提取：将生成的 32M 编程器固件存入专用文件夹
        cp -f bin/targets/mediatek/filogic/*nor-programmer-dump.bin bin/targets/mediatek/filogic/救砖专用/ || true
        # 物理提取：sysupgrade 升级包（用于 eMMC）
        cp -f bin/targets/mediatek/filogic/*emmc-sysupgrade.bin bin/targets/mediatek/filogic/救砖专用/ || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000_2305_32M_NOR_128G_eMMC
        path: openwrt/bin/targets/mediatek/filogic/救砖专用/*
