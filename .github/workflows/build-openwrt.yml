name: SL3000-Final-Release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. Checkout Config Repo
        uses: actions/checkout@v4
        with:
          path: main

      - name: 2. Checkout Source Repos
        run: |
          mkdir -p source-repo
          # 拉取底层三件套
          git clone --depth 1 --branch sl3000-full-sync https://github.com/ykm99999/66 source-repo
          # 拉取 ImmortalWrt 系统源码
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt immortalwrt-build

      - name: 3. Install Cross-Compiler
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu build-essential device-tree-compiler
          mkdir -p output

      - name: 4. Feeds Update
        run: |
          # 将底层源码移入，方便 part2 脚本处理
          mv source-repo immortalwrt-build/source-repo
          cd immortalwrt-build
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 执行 part1 (如果存在)
          [ -f ../main/diy-part1.sh ] && chmod +x ../main/diy-part1.sh && ../main/diy-part1.sh

      - name: 5. Patch & Bottom-Build
        run: |
          chmod +x main/diy-part2.sh
          cd immortalwrt-build
          $GITHUB_WORKSPACE/main/diy-part2.sh

      - name: 6. Build OpenWrt
        run: |
          cd immortalwrt-build
          [ -f ".config" ] || make defconfig
          make -j$(nproc) || make -j1 V=s

      - name: 7. Final Physical Merge
        run: |
          mkdir -p release_output
          FULL_BIN="release_output/SL3000-1GB-32MB-Full-Flash.bin"
          
          # 物理存在性校验
          if [ ! -s "output/bl2-nor.bin" ] || [ ! -s "output/fip-nor.bin" ]; then
             echo "❌ 关键产物缺失，终止缝合"; exit 1
          fi

          # 创建 32MB FF 实心底图
          tr '\000' '\377' < /dev/zero | dd of=$FULL_BIN bs=1M count=32
          
          # 像素级缝合：BL2(0), FIP(3.5M/3584K), Kernel(5.5M/5632K)
          dd if=output/bl2-nor.bin of=$FULL_BIN conv=notrunc
          dd if=output/fip-nor.bin of=$FULL_BIN bs=1k seek=3584 conv=notrunc
          
          SYS_BIN=$(find immortalwrt-build/bin/targets/ -name "*sysupgrade.bin" | head -1)
          if [ -s "$SYS_BIN" ]; then
              dd if=$SYS_BIN of=$FULL_BIN bs=1k seek=5632 conv=notrunc
              cp $SYS_BIN release_output/
          fi
          cp output/*.bin release_output/

      - name: 8. GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-${{ github.run_number }}
          files: release_output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
