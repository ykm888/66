name: SL3000 1G-32M Full Build

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main branch (Scripts & Configs)
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout source branch (MTK SDK Full Sync)
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Generate release tag
        id: release_tag
        run: |
          TAG_NAME="v$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Optimize Disk Space (Extreme Mode)
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/powershell /usr/lib/jvm
          sudo docker image prune -a -f
          df -h

      - name: Run diy-part1.sh (DTS & Feed Injection)
        run: |
          chmod +x main-repo/diy-part1.sh
          # 脚本内部需指向 source-repo/immortalwrt
          ./main-repo/diy-part1.sh

      - name: Run diy-part2.sh (ATF Patch & 32MB Stitching)
        run: |
          chmod +x main-repo/diy-part2.sh
          # 脚本内部处理 ATF 编译并生成 output/ 目录
          ./main-repo/diy-part2.sh

      - name: Audit Output Directory
        run: |
          echo "=== 🔍 产物物理审计 ==="
          ls -R output/ || echo "⚠️ 警告：output 目录为空"
          echo "=== 📦 最终发布文件清单 ==="
          find output/ -type f \( -name "*.bin" -o -name "*.tar.gz" -o -name "*.gz" \) | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "SL3000 1GB-32MB Rescue Firmware ${{ steps.release_tag.outputs.tag_name }}"
          body: |
            ## 🚀 SL3000 硬件定制版 (1GB DDR4 / 32MB SPI-NOR)
            
            ### 🛠️ 构建说明
            - **物理对齐**: FIP 偏移锁定为 **3.5MB (0x380000)**。
            - **内存锁定**: 强制训练 **1024MB DDR4**。
            - **源码同步**: 基于 `ykm99999/66` (sl3000-full-sync)。

            ### 📦 包含产物
            1. `SL3000_1G_RESCUE_32M.bin`: **32MB 全量救砖实心包** (BL2+FIP)。
            2. `mtk_uartboot.tar.gz`: 串口救砖工具包。
            3. `sysupgrade.bin`: 系统在线升级包。
          files: |
            output/rescue/*.bin
            output/*.bin
            output/*.tar.gz
            output/*.img
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-artifacts-${{ steps.release_tag.outputs.tag_name }}
          path: output/
          retention-days: 3
