name: 司洛SL-3000 物理硬化全家桶

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  CONFIG_FILE: 888/sl3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 物理环境初始化
      uses: actions/checkout@v4

    - name: 2. 安装物理依赖
      run: |
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip xxd zlib1g-dev
        sudo timedatectl set-timezone "$TZ"

    - name: 3. 源码抓取 (物理分支对齐)
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        # 物理准则一：脱离 Git 动态链接，确保本地物理环境完整性

    - name: 4. Feeds 注入与影子冲突物理清理
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        # 【物理准则二】：强制删除 feeds 影子，确保系统回溯到 package/boot 下的硬化版 Makefile
        rm -rf package/feeds/mediatek/arm-trusted-firmware-mediatek
        rm -rf package/feeds/mediatek/uboot-mediatek
        rm -rf tmp

    - name: 5. 物理注入核心零件 (888 工程物理覆盖)
      run: |
        # A. 物理覆盖 DTS 设备树
        [ -d 888 ] && find openwrt/target/linux/mediatek/ -type d -name "dts" -exec cp -f 888/mt7981-sl-3000-emmc.dts {} \;
        
        # B. 物理覆盖镜像打包宏 (救砖全家桶逻辑)
        [ -f 888/filogic.mk ] && cp -f 888/filogic.mk openwrt/target/linux/mediatek/image/
        
        # C. 物理注入 .config
        [ -f $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config
        
        # D. 物理注入 Files 固定设置
        [ -d files ] && mv files openwrt/files
        
        # 物理路径修复：修正 IP 和主机名
        cd openwrt
        sed -i 's/192.168.1.1/192.168.10.1/g' package/base-files/files/bin/config_generate
        sed -i 's/ImmortalWrt/SL-3000/g' package/base-files/files/bin/config_generate

    - name: 6. 预编译零件下载
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: 7. 顺序物理编译 (准则三：循序渐进，零件必出)
      run: |
        cd openwrt
        # 第一阶段：编译心脏 ATF (bl2.img)
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1 || exit 1
        
        # 第二阶段：编译大脑 U-Boot (fip.bin)
        make package/boot/uboot-mediatek/compile V=s -j1 || exit 1
        
        # 第三阶段：合体全量编译
        make -j$(nproc) || make -j1 V=s

    - name: 8. 物理搜集救砖全家桶 (RECOVERY_PACK)
      run: |
        cd openwrt/bin/targets/mediatek/filogic/
        mkdir -p RECOVERY_PACK
        # 物理识别并提取救砖零件
        cp *nor-programmer-dump.bin RECOVERY_PACK/ 2>/dev/null || true
        cp *emmc-sysupgrade.bin RECOVERY_PACK/ 2>/dev/null || true
        cp *bl2.img RECOVERY_PACK/ 2>/dev/null || true
        cp *fip.bin RECOVERY_PACK/ 2>/dev/null || true
        echo "FIRMWARE_PATH=$PWD/RECOVERY_PACK" >> $GITHUB_ENV

    - name: 9. 上传物理产物
      uses: actions/upload-artifact@v4
      with:
        name: SL3000_Recovery_Full_Pack
        path: ${{ env.FIRMWARE_PATH }}
