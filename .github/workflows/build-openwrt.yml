name: SL3000-eMMC-Final-Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'custom-config/**'
      - 'scripts/**'
      - 'diy-*.sh'
    tags: 
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - name: Checkout main repo (scripts)
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout OpenWrt source
        uses: actions/checkout@v4
        with:
          repository: ykm888/66
          ref: 2410
          path: openwrt  # 👈 固定为 openwrt，和脚本匹配

      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Run diy-part1.sh
        run: |
          chmod +x main-repo/diy-part1.sh
          ./main-repo/diy-part1.sh
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Run diy-part2.sh
        run: |
          chmod +x main-repo/diy-part2.sh
          ./main-repo/diy-part2.sh
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      # 👈 补上真正编译步骤
      - name: Build firmware
        run: |
          cd "$GITHUB_WORKSPACE/openwrt"
          make -j$(nproc) V=s

      - name: Generate Release Tag
        id: tag
        run: echo "release_tag=SL3000-eMMC-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: SL3000 eMMC 救砖固件 [${{ steps.tag.outputs.release_tag }}]
          body: |
            ### 🛠️ 编译说明
            - 设备：司络 SL3000 | MT7981B + MT7976CN
            - 存储：32MB SPI + 128GB eMMC
            - 启动：eMMC 启动 (root=/dev/mmcblk0p2)
            - 内存：原生 1GB（不强制512M）
            - 用途：eMMC 救砖、全盘烧录
          files: |
            openwrt/bin/targets/mediatek/filogic/*emmc*.bin
            openwrt/bin/targets/mediatek/filogic/*.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
