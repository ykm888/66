name: SL-3000 Ultimate Hardened Build

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  CONFIG_FILE: 888/sl3000.config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 环境初始化
      uses: actions/checkout@v4

    - name: 2. 安装物理依赖
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential device-tree-compiler qemu-utils rsync swig xxd python3-pyelftools
        sudo timedatectl set-timezone "$TZ"

    - name: 3. 源码与 Feeds 同步
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 4. 零件注入与影子抹除
      run: |
        cd openwrt
        chmod +x ../$DIY_P2_SH
        ../$DIY_P2_SH

    - name: 5. 加载配置与工具链预热 (解决 Error 2)
      run: |
        cd openwrt
        [ -f ../$CONFIG_FILE ] && cp -f ../$CONFIG_FILE .config
        make defconfig
        echo "Starting Toolchain Install... This may take 20 mins."
        make toolchain/install -j$(nproc) || make toolchain/install V=s

    - name: 6. 顺序物理编译 (心脏 -> 大脑 -> 合体)
      run: |
        cd openwrt
        # A. 编译基础库 (防止 ld-musl 拷贝报错)
        make package/libs/toolchain/compile V=s -j1 || true
        
        # B. 编译硬化 ATF (1MB 偏移对齐)
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
        
        # C. 编译硬化 U-Boot (SL-3000 DTS)
        make package/boot/uboot-mediatek/compile V=s -j1
        
        # D. 全量合成镜像
        make -j$(nproc) || make -j1 V=s

    - name: 7. 上传救砖全家桶
      uses: actions/upload-artifact@v4
      with:
        name: SL3000_Gold_Firmware
        path: openwrt/bin/targets/mediatek/filogic/*
