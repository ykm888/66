name: SL3000-eMMC-Final-Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.sh'
      - '**.dts'
      - '**.mk'
      - '**.config'
      - '.github/workflows/*.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # 你自己的仓库（脚本+配置）直接 checkout 到根目录
      - name: Checkout repo (scripts, dts, mk, config)
        uses: actions/checkout@v4
        path: .

      # 源码拉到 openwrt 文件夹
      - name: Checkout OpenWrt source
        uses: actions/checkout@v4
        with:
          repository: ykm888/66
          ref: 2410
          path: openwrt

      - name: Clean space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools rsync unzip zlib1g-dev wget gcc-aarch64-linux-gnu device-tree-compiler

      # 直接运行根目录脚本，不需要 main-repo
      - name: Run diy-part1.sh
        run: |
          chmod +x diy-part1.sh
          ./diy-part1.sh
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Run diy-part2.sh
        run: |
          chmod +x diy-part2.sh
          ./diy-part2.sh
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE/openwrt"
          make -j$(nproc) V=s

      - name: Release tag
        id: tag
        run: echo "release_tag=SL3000-eMMC-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

      - name: Upload firmware
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: SL3000 eMMC救砖固件
          files: |
            ${{ github.workspace }}/openwrt/bin/targets/mediatek/filogic/*.bin
            ${{ github.workspace }}/openwrt/bin/targets/mediatek/filogic/*.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
