name: SL3000-Physical-Recovery-Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gawk libncurses5-dev gettext libssl-dev xsltproc wget zstd python3-pyelftools
          git clone --depth 1 https://github.com/coolsnowwolf/immortalwrt.git openwrt

      - name: Execute Physical Repair
        run: |
          cd openwrt
          chmod +x ../diy-part1.sh && ../diy-part1.sh
          chmod +x ../diy-part2.sh && ../diy-part2.sh

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build Bootloaders (The Recovery Core)
        run: |
          cd openwrt
          make defconfig
          # 物理顺序：ATF -> U-Boot
          make package/boot/arm-trusted-firmware-mediatek/compile V=s -j$(nproc)
          make package/boot/uboot-mediatek/compile V=s -j$(nproc)

      - name: Build Full Firmware & Combine Image
        run: |
          cd openwrt
          # 触发 filogic.mk 的合成逻辑
          make target/linux/mediatek/image/compile V=s

      - name: Artifact Collection
        run: |
          mkdir -p bin_out
          find openwrt/bin/targets/mediatek/filogic/ -name "*nor-programmer-dump.bin" -exec cp -v {} bin_out/ \;

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Full-Image
          path: bin_out/
