name: Build SL-3000 Firmware

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  CONFIG_FILE: 888/sl3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Main (The Command Center)
      uses: actions/checkout@v4
      with:
        ref: main # 首先获取指挥部的文件（888目录和脚本）

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone OS Source (The Foundation)
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        # 将 main 分支的 888 目录和脚本移动到工作目录
        cp -r 888 openwrt/
        cp $DIY_P1_SH openwrt/
        cp $DIY_P2_SH openwrt/

    - name: Load Custom Feeds & Scripts
      working-directory: ./openwrt
      run: |
        chmod +x $DIY_P1_SH
        ./$DIY_P1_SH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Configuration & Physical Stitching
      working-directory: ./openwrt
      run: |
        # 注入 .config
        cp 888/sl3000.config .config
        # 执行物理缝合脚本 (解决 Error 2 的关键)
        chmod +x $DIY_P2_SH
        ./$DIY_P2_SH

    - name: Download Packages
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_SL3000_Firmware
        path: openwrt/bin/targets/mediatek/filogic/*
