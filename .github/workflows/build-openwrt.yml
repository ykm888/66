name: Build SL-3000 Firmware (23.05 Physical Sync)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  # 物理溯源：锁定地基分支
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  CONFIG_FILE: 888/sl3000.config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Command Center
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Initialization Environment
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo timedatectl set-timezone "$TZ"

    - name: Clone Foundation & Merge 888
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cp -r 888 openwrt/
        cp $DIY_P2_SH openwrt/

    - name: Update & Install Feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Physical Stitching & Hardening
      working-directory: ./openwrt
      run: |
        chmod +x $DIY_P2_SH
        ./$DIY_P2_SH
        make defconfig
        # 物理修正：检查系统真实的 ATF 包名是否存在
        grep -q "CONFIG_PACKAGE_trusted-firmware-a-mt7981-nor-ddr4=y" .config || { echo "!!! ATF Still Missing !!!"; exit 1; }

    - name: Compile Firmware
      working-directory: ./openwrt
      run: |
        make download -j8
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000_Firmware
        path: openwrt/bin/targets/mediatek/filogic/*nor-programmer-dump.bin
