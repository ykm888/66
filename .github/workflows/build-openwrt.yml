name: "OpenWrt Builder SL3000 Final V21"

on:
  workflow_dispatch:

env:
  # 源码与分支配置（严格锁定你的仓库）
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  UBOOT_REPO_URL: https://github.com/ykm888/66
  UBOOT_BRANCH: sl3000-uboot-base
  # 配置文件路径（物理锁定 main 分支路径）
  CONFIG_FILE: custom-config/sl3000.config
  DTS_FILE: custom-config/mt7981-sl-3000-emmc.dts
  MK_FILE: custom-config/filogic.mk
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 检出配置 (main 分支)
      uses: actions/checkout@v4
      with:
        ref: main

    - name: 2. 初始化环境 (物理依赖补全)
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq install device-tree-compiler libyaml-dev
        sudo timedatectl set-timezone "$TZ"

    - name: 3. 克隆源码与 U-Boot 源码注入
      run: |
        # 克隆主源码
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        
        # 【物理重点】注入你的 U-Boot 分支代码到 package 的 src 目录
        # 这种方式会强制编译器使用你的 uboot-base 代码
        rm -rf openwrt/package/boot/uboot-mediatek/src
        git clone --depth 1 $UBOOT_REPO_URL -b $UBOOT_BRANCH openwrt/package/boot/uboot-mediatek/src

    - name: 4. 物理注入三件套 (DTS/MK/Config)
      run: |
        cd openwrt
        # 物理注入 DTS 到 5.15 坑位
        mkdir -p target/linux/mediatek/files-5.15/arch/arm64/boot/dts/mediatek
        cp -f $GITHUB_WORKSPACE/$DTS_FILE target/linux/mediatek/files-5.15/arch/arm64/boot/dts/mediatek/
        
        # 物理注入 MK 镜像逻辑
        cp -f $GITHUB_WORKSPACE/$MK_FILE target/linux/mediatek/image/filogic.mk
        
        # 物理加载 .config
        cp -f $GITHUB_WORKSPACE/$CONFIG_FILE .config

    - name: 5. 更新/安装 Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 6. 物理编译内核准备与 DTS 补齐
      run: |
        cd openwrt
        echo "CONFIG_LINUX_5_15=y" >> .config
        make defconfig
        
        # 预编译工具链
        make tools/install -j$(nproc) || make tools/install V=s -j1
        make toolchain/install -j$(nproc) || make toolchain/install V=s -j1
        
        # 关键物理同步：将 files-5.15 的内容同步到构建目录
        make target/linux/prepare V=s -j1
        KERNEL_DTS_DEST=$(find build_dir/ -name "linux-5.15*" -type d | head -n 1)/arch/arm64/boot/dts/mediatek
        if [ -d "$KERNEL_DTS_DEST" ]; then
           cp -rf target/linux/mediatek/files-5.15/arch/arm64/boot/dts/mediatek/* "$KERNEL_DTS_DEST/"
        fi

    - name: 7. 执行固件编译
      run: |
        cd openwrt
        # 顺序：ATF -> U-Boot -> 全量
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
        make package/boot/uboot-mediatek/compile V=s -j1
        make -j$(nproc) || make -j1 V=s

    - name: 8. 整理产出物 (32MB 救砖包 + eMMC 升级包)
      id: organize
      run: |
        mkdir -p $GITHUB_WORKSPACE/FIRMWARE_OUT
        # 根据你的 MK 逻辑，搜索生成的 bin 文件
        find openwrt/bin/targets/ -name "*sl_3000*" -exec cp -f {} $GITHUB_WORKSPACE/FIRMWARE_OUT/ \;
        echo "FIRMWARE=$GITHUB_WORKSPACE/FIRMWARE_OUT" >> $GITHUB_ENV

    - name: 9. 发布至 Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: SL3000_23.05_5.15_Build
        files: ${{ env.FIRMWARE }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
