name: SL-3000-PHYSICAL-RECOVERY-BUILD

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66.git
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理检出当前仓库
        uses: actions/checkout@v4

      - name: 环境筑基 (安装核心编译工具)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gawk libncurses5-dev gettext libssl-dev xsltproc wget zstd curl python3-pyelftools
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: Feeds 更新与安装
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 物理强灌救砖零件
        run: |
          chmod +x diy-part2.sh
          ./diy-part2.sh

      - name: 筑基与工具链准备
        run: |
          cd openwrt
          # 重新生成配置索引 (此时将识别到新 Makefile)
          make defconfig
          # 优先编译必须的底层工具
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 炼化救砖全家桶 (强制路径编译)
        run: |
          cd openwrt
          # [诊断修正]：直接编译包目录，系统将根据 .config 中的 CONFIG_PACKAGE_... 自动炼制
          make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
          make package/boot/uboot-mediatek/compile V=s -j1

      - name: 产物搜救提取
        if: always()
        run: |
          mkdir -p outputs
          # 优先从你在 Makefile 中定义的 recovery 专用目录打捞
          if [ -d "openwrt/bin/sl3000-recovery" ]; then
            cp -v openwrt/bin/sl3000-recovery/* outputs/
          fi
          
          # 备选搜寻：防止路径变动导致的遗漏
          find openwrt/bin/targets/mediatek/filogic/ -type f -name "*bl2*" -exec cp -v {} outputs/ \;
          find openwrt/bin/targets/mediatek/filogic/ -type f -name "*u-boot*" -exec cp -v {} outputs/ \;

      - name: 上传救砖黄金产物
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Recovery-Binaries
          path: outputs/
