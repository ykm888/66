name: SL3000 1G-32M Full Build

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libncurses5-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler qemu-utils \
            libtool libtool-bin autoconf automake autopoint libelf-dev \
            antlr3 gperf swig libtinfo5
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Run diy-part1.sh
        run: |
          chmod +x main-repo/diy-part1.sh
          ./main-repo/diy-part1.sh

      - name: Run diy-part2.sh
        run: |
          # 修复权限防止提取失败
          sudo chown -R runner:runner source-repo
          chmod +x main-repo/diy-part2.sh
          ./main-repo/diy-part2.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_id }}
          name: "SL3000 1GB-32MB Recovery Build"
          files: |
            output/rescue/*.bin
            output/*.bin
            output/*.itb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-firmware
          path: output/
          if-no-files-found: error # 🔴 如果为空则报错，不许静默跳过
