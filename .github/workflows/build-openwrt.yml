name: Build SL-3000 1024M (Native Fix)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  CONFIG_FILE: custom-config/sl3000.config
  DIY_P2_SH: scripts/diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        # 物理清理：确保 5.15 内核编译有足够的 IO 空间
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
        
        sudo -E apt-get -qq update
        # 物理安装：包含 bc (寻址计算) 和 dtc (DTS 合成)
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq install bc python3-setuptools device-tree-compiler
        
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone Source Code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Update & Install Feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Execute DIY-Part2 Script
      working-directory: openwrt
      run: |
        # 物理调用脚本：解决 Feeds 动态组件依赖冲突
        [ -e ../$DIY_P2_SH ] && chmod +x ../$DIY_P2_SH && ../$DIY_P2_SH

    - name: Load Custom Configuration
      working-directory: openwrt
      run: |
        [ -f ../$CONFIG_FILE ] && cp ../$CONFIG_FILE .config
        # Makefile 已固化修复，此处仅生成最终 .config
        make defconfig

    - name: Download Library Packages
      working-directory: openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      working-directory: openwrt
      run: |
        # 开启详细日志，观察 Makefile 的物理手术是否生效
        make -j$(nproc) || make -j1 V=s

    - name: Organize Files
      run: |
        mkdir -p bin/firmware
        cp -f openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin bin/firmware/
        # 提取在 Makefile 中备份的救砖零件 (BL2/FIP)
        cp -rf openwrt/bin/targets/mediatek/filogic/sl3000-recovery bin/ 2>/dev/null || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-1024M-Firmware
        path: bin/
