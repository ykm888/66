name: Build SL-3000 (Manual-Rescue-512M)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  CONFIG_FILE: 888/sl3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Checkout Build Branch
      uses: actions/checkout@v4
      with:
        ref: ${{ env.REPO_BRANCH }}

    - name: 1.5. Physics Bridge: Fetch Parts from Main
      run: |
        # 从 main 分支物理提取 888 文件夹、package 文件夹和脚本
        git fetch origin main
        git checkout origin/main -- 888/ package/ "$DIY_P1_SH" "$DIY_P2_SH" 2>/dev/null || true
        ls -d 888/ package/ 2>/dev/null || echo "Warning: Physical parts not found in main"

    - name: 2. Initialization Environment
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler dos2unix fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgpgme11-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip vim wget xmlto xz-utils zlib1g-dev bc
        sudo timedatectl set-timezone "$TZ"

    - name: 3. Clone OpenWrt Source
      run: git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: 4. Execute DIY-Part1 Script
      working-directory: openwrt
      run: |
        [ -f "../$DIY_P1_SH" ] && dos2unix "../$DIY_P1_SH" && chmod +x "../$DIY_P1_SH" && ../$DIY_P1_SH ; true

    - name: 5. Update Feeds
      working-directory: openwrt
      run: ./scripts/feeds update -a

    - name: 6. Physical Package Implantation & Deep Clean
      run: |
        rm -rf openwrt/package/feeds/mediatek/arm-trusted-firmware-mediatek
        rm -rf openwrt/package/feeds/mediatek/uboot-mediatek
        mkdir -p openwrt/package/boot/arm-trusted-firmware-mediatek
        mkdir -p openwrt/package/boot/uboot-mediatek
        # 执行跨分支搬运后的物理覆盖
        cp -f package/boot/arm-trusted-firmware-mediatek/Makefile openwrt/package/boot/arm-trusted-firmware-mediatek/Makefile
        cp -f package/boot/uboot-mediatek/Makefile openwrt/package/boot/uboot-mediatek/Makefile
        find openwrt/target/linux/mediatek/ -type d -name "dts" -exec cp -f 888/mt7981-sl-3000-emmc.dts {} \;
        [ -f 888/filogic.mk ] && cp -f 888/filogic.mk openwrt/target/linux/mediatek/image/
        rm -rf openwrt/tmp

    - name: 7. Install Feeds & DIY-Part2
      working-directory: openwrt
      run: |
        ./scripts/feeds install -a
        [ -f "../$DIY_P2_SH" ] && dos2unix "../$DIY_P2_SH" && chmod +x "../$DIY_P2_SH" && ../$DIY_P2_SH ; true

    - name: 8. Load Custom Configuration & Sanity Check
      working-directory: openwrt
      run: |
        [ -f ../$CONFIG_FILE ] && cp -f ../$CONFIG_FILE .config
        make defconfig

    - name: 9. Download Library Packages
      working-directory: openwrt
      run: make download -j8

    - name: 10. Compile Firmware
      working-directory: openwrt
      run: make -j$(nproc) || make -j1 V=s

    - name: 11. Organize Files
      run: |
        mkdir -p bin/firmware
        find openwrt/bin/targets/mediatek/filogic/ -name "*nor-programmer-dump.bin" -exec cp -f {} bin/firmware/sl3000-32M-rescue.bin \;
        find openwrt/bin/targets/mediatek/filogic/ -name "*sysupgrade.bin" -exec cp -f {} bin/firmware/ \;
        cp -rf openwrt/bin/targets/mediatek/filogic/sl3000-recovery bin/ 2>/dev/null || true

    - name: 12. Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-Rescue-Final
        path: bin/
