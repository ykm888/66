name: SL3000-Boot-Build
on:
  workflow_dispatch:    # 仅手动点Run，绝不自动编译

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout 配置仓库
        uses: actions/checkout@v4

      - name: 安装编译工具
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-aarch64-linux-gnu make git libssl-dev flex bison

      # 关键：拉你救砖底层源码分支
      - name: 拉取 sl3000-clean-source 底层源码
        uses: actions/checkout@v4
        with:
          repository: ykm888/66
          ref: sl3000-clean-source   # 你真正的底层分支
          path: source

      # 只编译 ATF + U-Boot，不碰Linux内核，彻底告别patch失败
      - name: 编译 ATF
        run: |
          cd source/atf
          make CROSS_COMPILE=aarch64-linux-gnu- PLAT=mt7981

      - name: 编译 U-Boot
        run: |
          cd source/u-boot
          make CROSS_COMPILE=aarch64-linux-gnu- mt7981_sl3000_defconfig
          make CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      # 打包救砖文件
      - name: 打包救砖全家桶
        run: |
          mkdir -p output
          cp source/atf/build/mt7981/release/bl2.bin output/
          cp source/atf/build/mt7981/release/fip.bin output/
          cp source/u-boot/u-boot.bin output/
          cp source/u-boot/u-boot.itb output/

      - name: 发布救砖包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sl3000-boot-$(date +%Y%m%d-%H%M)
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
