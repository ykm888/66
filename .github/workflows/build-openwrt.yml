name: SL-3000 Final Hardened Build

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  CONFIG_FILE: 888/sl3000.config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 环境初始化
      uses: actions/checkout@v4

    - name: 2. 安装物理依赖
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential device-tree-compiler qemu-utils rsync swig xxd python3-pyelftools
        sudo timedatectl set-timezone "$TZ"

    - name: 3. 源码与 Feeds 初步同步
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 4. 执行物理手术 (注入硬化零件)
      run: |
        cd openwrt
        chmod +x ../$DIY_P2_SH
        ../$DIY_P2_SH
        # 强制重置索引，确保系统识别到我们注入的本地零件
        rm -rf tmp
        ./scripts/feeds update -i
        ./scripts/feeds install -a

    - name: 5. 工具链预热 (解决 ld-musl Error)
      run: |
        cd openwrt
        [ -f ../$CONFIG_FILE ] && cp -f ../$CONFIG_FILE .config
        make defconfig
        # 物理预热：先产出工具链，否则后续 cp 指令必崩
        make toolchain/install -j$(nproc) || make toolchain/install V=s

    - name: 6. 顺序物理编译
      run: |
        cd openwrt
        # A. 确保基础库就位
        make package/libs/toolchain/compile V=s -j1 || true
        # B. 产出硬化 ATF (心脏)
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
        # C. 产出硬化 U-Boot (大脑)
        make package/boot/uboot-mediatek/compile V=s -j1
        # D. 全量合成 (32MB 救砖包)
        make -j$(nproc) || make -j1 V=s

    - name: 7. 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: SL3000_Gold_Build
        path: openwrt/bin/targets/mediatek/filogic/
