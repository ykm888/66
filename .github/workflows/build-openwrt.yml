name: Build SL-3000 Firmware

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  CONFIG_FILE: 888/sl3000.config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Main (The Command Center)
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo apple-linux-set-timezone "$TZ" || sudo timedatectl set-timezone "$TZ"

    - name: Clone OS Source (The Foundation)
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cp -r 888 openwrt/
        cp $DIY_P2_SH openwrt/

    - name: Update & Install Feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Physical Stitching & Hardening
      working-directory: ./openwrt
      run: |
        # 1. 物理对齐基础配置
        [ -f "888/sl3000.config" ] && cp 888/sl3000.config .config || { echo "!!! Config Missing !!!"; exit 1; }
        
        # 2. 执行物理三准则脚本 (注入熔断)
        chmod +x $DIY_P2_SH
        ./$DIY_P2_SH || { echo "!!! DIY-Part2 Physical Break !!!"; exit 1; }
        
        # 3. 终极零件校验：确保开关已打开
        grep -q "CONFIG_PACKAGE_arm-trusted-firmware-mediatek=y" .config || { echo "!!! ATF Switch Failed !!!"; exit 1; }
        grep -q "CONFIG_PACKAGE_uboot-mediatek=y" .config || { echo "!!! U-Boot Switch Failed !!!"; exit 1; }

    - name: Compile Firmware
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j8
        # 物理级错误捕捉：如果编译失败，立即报错不再进入上传阶段
        make -j$(nproc) || make -j1 V=s || { echo "!!! Compilation Failed !!!"; exit 1; }

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_SL3000_Firmware
        path: openwrt/bin/targets/mediatek/filogic/*
