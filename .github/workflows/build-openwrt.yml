name: SL-3000-FINAL-HARDENING

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理检出代码
        uses: actions/checkout@v4

      - name: 环境筑基
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gawk libncurses5-dev gettext libssl-dev xsltproc wget zstd curl
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt -b openwrt-23.05 openwrt

      - name: 更新 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 零件全链路强灌
        run: |
          # 核心修正：在根目录直接执行，不再进入 openwrt 目录运行
          chmod +x diy-part2.sh
          ./diy-part2.sh

      - name: 生成锚点
        run: |
          cd openwrt
          # 此时零件已在物理位置，执行对齐
          make defconfig

      - name: 磨刀 (工具链)
        run: |
          cd openwrt
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 强灌与炼化 (精准变体编译)
        run: |
          cd openwrt
          # 强制指定变体路径进行编译，绕过自动选择逻辑
          make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
          make package/boot/uboot-mediatek/compile V=s -j1

      - name: 产物暴力提取
        if: always()
        run: |
          mkdir -p outputs
          # 物理全盘扫描所有生成的镜像零件
          find openwrt/bin/ -type f \( -name "*bl2*" -o -name "*fip*" -o -name "*u-boot.bin*" \) -exec cp -v {} outputs/ \;
          find openwrt/build_dir/ -type f \( -name "bl2.img" -o -name "fip.bin" -o -name "u-boot.bin" \) -exec cp -v {} outputs/ \;
          ls -R outputs/

      - name: 上传救砖镜像
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Hardened-Binaries
          path: outputs/
