name: SL3000-512M-Final-Build

on:
  workflow_dispatch:
  push:
    paths:
      - '888/**'
    tags: 
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: ykm888/66 
          ref: 2410
          path: source-repo

      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Run diy-part1.sh (Purge & Core Prep)
        run: |
          chmod +x main-repo/diy-part1.sh
          ./main-repo/diy-part1.sh
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Run diy-part2.sh (Build & Release)
        run: |
          chmod +x main-repo/diy-part2.sh
          ./main-repo/diy-part2.sh
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Generate Release Tag
        id: tag
        run: echo "release_tag=SL3000-512M-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: SL3000 512M 救砖固件 [${{ steps.tag.outputs.release_tag }}]
          body: |
            ### 🛠️ 编译说明
            - **物理切除**: 已移除 package/5g-modem 解决死循环依赖。
            - **依赖修复**: 预编译 mbedtls/ustream-ssl 解决 CMake 报错。
            - **内核**: Linux 5.4 (ykm888/66)。
          files: |
            output/firmware/*.bin
            output/firmware/*.img.gz
            output/firmware/*.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
