name: Build SL-3000 (1024M Physical Fix)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  CONFIG_FILE: custom-config/sl3000.config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Checkout Main Repository
      uses: actions/checkout@v4

    - name: 2. Initialization Environment
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq install bc python3-setuptools device-tree-compiler dos2unix
        sudo timedatectl set-timezone "$TZ"

    - name: 3. Clone OpenWrt Source
      run: git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: 4. Update & Install Feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 5. Execute DIY-Part2 Script
      working-directory: openwrt
      run: |
        if [ -f "../$DIY_P2_SH" ]; then
            dos2unix "../$DIY_P2_SH"
            chmod +x "../$DIY_P2_SH"
            ../$DIY_P2_SH
        fi

    - name: 6. Physical Package Implantation
      run: |
        # 物理注入：将仓库中定制的 1024M 零件 Makefile 强制覆盖到编译位
        mkdir -p openwrt/package/boot/arm-trusted-firmware-mediatek
        mkdir -p openwrt/package/boot/uboot-mediatek
        
        [ -f package/boot/arm-trusted-firmware-mediatek/Makefile ] && \
            cp -f package/boot/arm-trusted-firmware-mediatek/Makefile openwrt/package/boot/arm-trusted-firmware-mediatek/Makefile
            
        [ -f package/boot/uboot-mediatek/Makefile ] && \
            cp -f package/boot/uboot-mediatek/Makefile openwrt/package/boot/uboot-mediatek/Makefile

        # 物理注入：DTS 与 镜像合成脚本
        [ -f custom-config/mt7981-sl-3000-emmc.dts ] && \
            cp -f custom-config/mt7981-sl-3000-emmc.dts openwrt/target/linux/mediatek/dts/
        [ -f custom-config/filogic.mk ] && \
            cp -f custom-config/filogic.mk openwrt/target/linux/mediatek/image/

        echo "All physical components implanted successfully."

    - name: 7. Load Custom Configuration
      working-directory: openwrt
      run: |
        cp -f ../$CONFIG_FILE .config
        # 物理二次锁定：确保 PGTABLE 参数在 defconfig 后不丢失
        echo "CONFIG_PGTABLE_LEVELS=3" >> .config
        make defconfig

    - name: 8. Download Library Packages
      working-directory: openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 9. Compile Firmware
      working-directory: openwrt
      run: |
        # 物理并行编译：失败则回退至单核 V=s 输出
        make -j$(nproc) || make -j1 V=s

    - name: 10. Organize Files
      run: |
        mkdir -p bin/firmware
        cp -f openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin bin/firmware/
        cp -rf openwrt/bin/targets/mediatek/filogic/sl3000-recovery bin/ 2>/dev/null || true

    - name: 11. Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-1024M-Firmware
        path: bin/

    - name: 12. Cleanup Workspace
      run: rm -rf openwrt
