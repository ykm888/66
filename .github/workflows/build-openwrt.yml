name: SL3000-512M-Rescue-AutoRelease-V2

on:
  workflow_dispatch:
  push:
    paths:
      - '888/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # 必须开启权限以创建 Release
    
    steps:
      - name: Checkout Configs (main)
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout Firmware Source (ykm888 2410)
        uses: actions/checkout@v4
        with:
          repository: ykm888/66
          ref: 2410
          path: firmware-repo

      - name: Initialization Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext git \
            libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget device-tree-compiler
          mkdir -p output/firmware

      - name: Run V2 Build Script
        run: |
          chmod +x ./main-repo/diy-part1.sh
          ./main-repo/diy-part1.sh

      - name: Generate Release Tag
        id: tag
        run: |
          echo "release_tag=SL3000-512M-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: SL3000 (512M) 救砖固件 - ${{ steps.tag.outputs.release_tag }}
          body: |
            ### 🛠️ 固件构建信息
            - **底层仓库**: ykm888/66 (2410 分支 / 5.4内核)
            - **设备注册**: 独立 .mk 注入 (mt7981_sl3000.mk)
            - **内存规格**: 物理锁定 512MB RAM
            - **集成驱动**: MMC/eMMC, F2FS, USB3.0, KSMBD, TTYD
          files: output/firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
