name: SL-3000-PHYSICAL-ONE-STEP-FIX

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66.git
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 筑基环境 (物理依赖对齐)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gawk libncurses5-dev gettext libssl-dev xsltproc wget zstd curl python3-pyelftools
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: 强灌零件与架构死锁
        run: |
          chmod +x diy-part2.sh
          ./diy-part2.sh

      - name: 刷新配置索引 (物理二次锁定)
        run: |
          cd openwrt
          ./scripts/feeds update -a && ./scripts/feeds install -a
          # 建立架构索引，此步会产生你之前见到的 override 警告，那是成功的标志
          make defconfig
          # 强制补强，防止 feeds 或 defconfig 意外修正回 x86
          printf "CONFIG_TARGET_mediatek=y\nCONFIG_TARGET_mediatek_filogic=y\nCONFIG_PACKAGE_arm-trusted-firmware-mediatek-mt7981-nor-ddr4=y\nCONFIG_PACKAGE_uboot-mediatek-mt7981_sl3000=y\n" >> .config
          make defconfig

      - name: 炼化救砖全家桶 (物理编译)
        run: |
          cd openwrt
          # 预编译底层工具链 (MT7981 必须)
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          # 核心编译指令
          make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
          make package/boot/uboot-mediatek/compile V=s -j1

      - name: 暴力打捞 (物理现场搜救)
        if: always()
        run: |
          mkdir -p outputs
          echo "--- [正在搜救二进制产物] ---"
          # 直接进入源码编译位置打捞，这是物理第一现场，产物绝对逃不掉
          find openwrt/build_dir/ -name "bl2.bin" -exec cp -v {} outputs/bl2.img \; || true
          find openwrt/build_dir/ -name "fip.bin" -exec cp -v {} outputs/fip.bin \; || true
          find openwrt/build_dir/ -name "u-boot.bin" -exec cp -v {} outputs/u-boot.bin \; || true
          
          # 检查 bin 目录 (作为备选)
          [ -d "openwrt/bin" ] && find openwrt/bin/ -type f \( -name "*bl2*" -o -name "*u-boot*" -o -name "*fip*" \) -exec cp -v {} outputs/ \; || true
          
          echo "--- [打捞清单展示] ---"
          ls -R outputs/

      - name: 上传黄金产物
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-RECOVERY-BINARIES
          path: outputs/
