name: SL3000-Full-Sync-Absolute-Build

on:
  repository_dispatch:
  workflow_dispatch:

env:
  # 🔒 唯一溯源地址
  FULL_REPO: https://github.com/ykm99999/66
  FULL_BRANCH: sl3000-full-sync
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 安装物理编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential flex bison \
        gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
        device-tree-compiler python3-pyelftools qemu-utils libncurses5-dev \
        libssl-dev u-boot-tools rsync unzip zlib1g-dev

    - name: 2. 物理全量克隆 (Clone All 4 Dirs)
      run: |
        # 直接克隆整个同步分支，确保 4 个目录都在里面
        git clone --depth 1 $FULL_REPO -b $FULL_BRANCH workspace

    - name: 3. 编译救砖全家桶 (ATF + U-Boot + OpenWrt)
      run: |
        cd workspace
        # 赋予自定义脚本执行权限
        chmod +x diy-part2.sh
        # 执行脚本，脚本内部会分别进入 arm-trusted-firmware, u-boot, immortalwrt 进行编译
        ./diy-part2.sh

    - name: 4. 整理并提取全家桶产物
      run: |
        mkdir -p ./final_out/rescue
        # 提取缝合好的 32MB 救砖包 (由脚本生成在 output 目录)
        if [ -d "workspace/output/rescue" ]; then
          cp -r workspace/output/rescue/* ./final_out/rescue/
        fi
        
        # 提取系统固件
        TARGET_BIN="workspace/immortalwrt/bin/targets/mediatek/filogic/"
        if [ -d "$TARGET_BIN" ]; then
          find "$TARGET_BIN" -type f \( -name "*spi-nor*" -o -name "*.itb" \) -exec cp {} ./final_out/ \;
        fi

    - name: 5. 上传 SL3000 终极全家桶
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-Full-Sync-Rescue-Kit
        path: ./final_out/
