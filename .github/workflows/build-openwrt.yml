name: "SL3000-1024M-Full-Recovery-Suite"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理环境初始化 (工序一)
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig libpython3-dev qemu-utils
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: 2. 物理克隆源码 (工序二 - 完美同步你的源端修复)
        run: |
          # 直接物理同步你已修复 U-Boot 和 ebtables 的分支
          git clone --depth 1 -b sl3000-immortalwrt-bootstrap https://github.com/ykm888/66 openwrt

      - name: 3. 物理更新与安装 Feeds (工序三)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4. 物理净化与全量配置对齐 (工序四)
        run: |
          cd openwrt
          # 1. 【核心全量配置拉取】
          curl -fLo .config https://raw.githubusercontent.com/ykm888/66/sl3000-immortalwrt-bootstrap/sl3000_full_recovery.config
          
          # 2. 【物理切除病灶】 - 即使源端有修复，Actions 运行时物理清理 rd05a1 依然是双重保险
          find package/ -type d -name "datconf" -exec rm -rf {} +
          find package/ -type d -name "rd05a1" -exec rm -rf {} +
          find . -name "Kconfig" -exec sed -i '/rd05a1/d' {} +
          find . -name "Kconfig" -exec sed -i '/datconf/d' {} +

          # 3. 【物理参数强锁】 - 确保 1024M 颗粒定义物理生效
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y" >> .config
          
          # 4. 物理验证：检查你修改的 ebtables URL 是否生效
          echo "--- 物理验证 ebtables 源码路径 ---"
          grep "PKG_SOURCE_URL" $(find package/ -name Makefile | grep "ebtables/Makefile")
          
          make defconfig

      - name: 5. 物理下载源码包 (工序五)
        run: |
          cd openwrt
          # 使用全速物理下载
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: 6. 物理执行全量构建 (工序六)
        run: |
          cd openwrt
          # 核心工序：物理火力全开进行构建
          make -j$(nproc) || make -j1 V=s

      - name: 7. 物理搜集“救砖全家桶”产物 (工序七)
        run: |
          cd openwrt
          mkdir -p out_images
          # 物理抓取：Factory, Sysupgrade, BL2, FIP, GPT
          find bin/targets/mediatek/filogic/ -name "*sl_3000-emmc*" -exec cp -v {} out_images/ \;
          find bin/targets/mediatek/filogic/ -name "*bl2.bin" -exec cp -v {} out_images/ \;
          find bin/targets/mediatek/filogic/ -name "*fip.bin" -exec cp -v {} out_images/ \;
          find bin/targets/mediatek/filogic/ -name "*gpt.bin" -exec cp -v {} out_images/ \;
          
          # 生成物理指纹校验
          cd out_images && sha256sum * > sha256sums-sl3000-1024M.txt

      - name: 8. 上传救砖全家桶 (工序八)
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-1024M-Full-Recovery-Pack
          path: openwrt/out_images/
