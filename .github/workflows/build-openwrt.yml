name: SL3000 1G-32M Full Build

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libncurses5-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler qemu-utils \
            libtool libtool-bin autoconf automake autopoint libelf-dev \
            antlr3 gperf swig libtinfo5
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Run diy-part1.sh
        run: |
          chmod +x main-repo/diy-part1.sh
          ./main-repo/diy-part1.sh

      - name: Run diy-part2.sh
        run: |
          # 物理接管权限，确保 runner 用户可以读取并提取 output 目录
          sudo chown -R runner:runner $GITHUB_WORKSPACE
          chmod +x main-repo/diy-part2.sh
          ./main-repo/diy-part2.sh

      - name: Physical Audit (物理审计)
        run: |
          echo "=== 🔍 最终产物清单统计 ==="
          ls -R output/
          echo "=========================="

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_id }}
          name: "SL3000 1GB-32MB Recovery Build [$(date +'%Y-%m-%d')]"
          body: |
            ## 🚀 SL3000 1GB RAM / 32MB SPI-NOR 专用固件
            - **32MB Rescue**: 包含 BL2+FIP+OpenWrt 的全量编程器固件。
            - **Upgrade ITB**: 适配 1024M 内存补丁的系统升级包。
            - **DRAM Patch**: 已物理锁定 1024MB DDR4 训练参数。
          files: |
            output/rescue/SL3000_1GB_RESCUE_32M.bin
            output/rescue/bl2-1g-nor.bin
            output/rescue/fip-nor.bin
            output/*.bin
            output/*.itb
            output/*.tar.gz
            output/*.manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-firmware-full-pack
          path: output/
          if-no-files-found: error
