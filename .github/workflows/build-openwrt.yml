name: SL3000-1024M-Full-Recovery-Suite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理环境初始化
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig libpython3-dev qemu-utils
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: 2. 物理克隆源码
        run: |
          git clone --depth 1 -b sl3000-padavan-2410 https://github.com/ykm888/66 openwrt

      - name: 3. 物理更新与安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4. 物理净化与架构锁定 (核心修复步骤)
        run: |
          cd openwrt
          # 1. 物理拉取 8000 行全量配置
          curl -fLo .config https://raw.githubusercontent.com/ykm888/66/main/custom-config/sl3000.config
          
          # 2. 【物理手术】：切除 datconf 和 rd05a1 病灶
          # 彻底删除文件夹，并全局清理 Kconfig 中的递归依赖行
          find . -type d -name "datconf" -exec rm -rf {} +
          find . -type d -name "rd05a1" -exec rm -rf {} +
          find . -name "Kconfig" -exec sed -i '/depends on PACKAGE_rd05a1/d' {} +
          find . -name "Kconfig" -exec sed -i '/select PACKAGE_rd05a1/d' {} +
          
          # 3. 【物理锁定】：强制锁定 MT7981 1024M 硬件参数
          # 确保生成针对 EMMC 和 1024M 内存的引导文件
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_sl_3000-emmc=y" >> .config
          echo "CONFIG_TARGET_IMAGE_uboot_mediatek_mt7981_sl_3000_emmc=y" >> .config
          
          # 4. 执行物理对齐膨胀
          make defconfig

      - name: 5. 物理下载源码包
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: 6. 物理执行编译
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 7. 物理搜集“救砖全家桶”产物
        run: |
          cd openwrt
          mkdir -p out_images
          
          # 搜集系统固件 (Factory & Sysupgrade)
          find bin/targets/mediatek/mt7981/ -name "*sl_3000-emmc*" -exec cp -v {} out_images/ \;
          
          # 搜集引导全家桶 (BL2 & FIP) - 这是救砖的关键
          find bin/targets/mediatek/mt7981/ -name "*bl2.bin" -exec cp -v {} out_images/ \;
          find bin/targets/mediatek/mt7981/ -name "*fip.bin" -exec cp -v {} out_images/ \;
          
          # 搜集分区表 (GPT)
          find bin/targets/mediatek/mt7981/ -name "*gpt.bin" -exec cp -v {} out_images/ \;
          
          # 生成物理校验清单
          cd out_images && sha256sum * > sha256sums-sl3000-1024M.txt

      - name: 8. 上传救砖全家桶
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-1024M-Full-Recovery-Pack
          path: openwrt/out_images/
