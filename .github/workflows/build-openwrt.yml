name: "SL3000-23.05-5.15-Build-V11-Recovery-Ready"

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  UBOOT_REPO_URL: https://github.com/ykm888/66
  UBOOT_BRANCH: sl3000-uboot-base
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: custom-config/sl3000.config
  DTS_FILE: custom-config/mt7981-sl-3000-emmc.dts
  MK_FILE: custom-config/filogic.mk
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        # 物理注入修复好的 U-Boot 源代码到对应的编译目录
        rm -rf openwrt/package/boot/uboot-mediatek/src
        git clone --depth 1 $UBOOT_REPO_URL -b $UBOOT_BRANCH openwrt/package/boot/uboot-mediatek/src

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && cp -f $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt && $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update/Install feeds
      run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        # 1. 物理注入 DTS 和镜像生成脚本
        cp -f $GITHUB_WORKSPACE/$DTS_FILE openwrt/target/linux/mediatek/files-5.15/arch/arm64/boot/dts/mediatek/mt7981-sl-3000-emmc.dts
        cp -f $GITHUB_WORKSPACE/$MK_FILE openwrt/target/linux/mediatek/image/filogic.mk
        
        # 2. 加载 .config 基础配置
        [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && cp -f $GITHUB_WORKSPACE/$CONFIG_FILE openwrt/.config
        
        # 3. 执行 diy-part2.sh (含强制注入 CONFIG_PACKAGE 逻辑)
        chmod +x $DIY_P2_SH
        cd openwrt && $GITHUB_WORKSPACE/$DIY_P2_SH
        
        # 4. 【核心修复】执行 defconfig 刷新配置依赖，确保 ATF/U-Boot 选定
        cd openwrt && make defconfig

    - name: Compile the firmware
      run: |
        cd openwrt
        # 优先编译工具链
        make tools/install -j$(nproc)
        make toolchain/install -j$(nproc)
        
        # 【物理级联修复】必须先编译 ATF，产生 bl31.bin 供 U-Boot 使用
        echo "正在编译救砖心脏: ATF..."
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
        
        echo "正在编译救砖大脑: U-Boot..."
        make package/boot/uboot-mediatek/compile V=s -j1
        
        # 开始系统全局编译
        echo "正在执行全局编译..."
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize files (提取救砖全家桶)
      if: success()
      run: |
        mkdir -p $GITHUB_WORKSPACE/outputs
        cd openwrt/bin/targets/mediatek/filogic/
        
        # 1. 提取 BL2 和 FIP (针对 NOR 启动)
        cp -f *bl2* $GITHUB_WORKSPACE/outputs/ 2>/dev/null || true
        cp -f *fip* $GITHUB_WORKSPACE/outputs/ 2>/dev/null || true
        
        # 2. 提取全量 Dump (离线编程器救砖固件)
        cp -f *nor-programmer-dump.bin $GITHUB_WORKSPACE/outputs/ 2>/dev/null || true
        
        # 3. 提取常规 factory 固件
        cp -f *factory.bin $GITHUB_WORKSPACE/outputs/ 2>/dev/null || true
        
        echo "文件提取完成，准备上传。"

    - name: Upload Recovery Kits
      uses: actions/upload-artifact@v4
      with:
        name: SL3000_Recovery_Kits
        path: ${{ github.workspace }}/outputs
