name: SL3000-eMMC-Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.sh'
      - '**.config'
      - '**.dts'
      - '**.mk'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout 配置仓库
        uses: actions/checkout@v4

      - name: Checkout OpenWrt 源码
        uses: actions/checkout@v4
        with:
          repository: ykm888/66
          ref: 2410
          path: openwrt

      - name: 清理空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            git libncurses-dev libssl-dev python3-distutils \
            python3-setuptools rsync unzip zlib1g-dev wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: 运行 diy-part1.sh
        run: |
          chmod +x diy-part1.sh
          ./diy-part1.sh

      - name: 运行 diy-part2.sh
        run: |
          chmod +x diy-part2.sh
          ./diy-part2.sh

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: 生成版本标签
        id: tag
        run: echo "release_tag=SL3000-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: 上传固件到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: openwrt/bin/targets/mediatek/filogic/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
