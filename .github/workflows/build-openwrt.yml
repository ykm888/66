name: SL-3000 DDR4 1MB-Hardened Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Initialization Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc wget unzip qemu-utils device-tree-compiler flex bison
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Clone OpenWrt Source
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt -b openwrt-23.05 openwrt

      - name: Update Feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare Config & Source
        working-directory: ./openwrt
        run: |
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_mediatek_mt7981-rfb-flash=y" >> .config
          make defconfig
          # 物理预处理：解压 ATF 和 U-Boot，为 diy-part2.sh 注入零件创造物理空间
          make package/boot/arm-trusted-firmware-mediatek/prepare V=s
          make package/boot/uboot-mediatek/prepare V=s

      - name: Execute Physical Hardening (diy-part2.sh)
        run: |
          chmod +x main-repo/diy-part2.sh
          cd openwrt && ../main-repo/diy-part2.sh

      - name: Compile Unbrick Kit (DDR4 Locked)
        working-directory: ./openwrt
        run: |
          # 像素级对齐变体名称
          make package/boot/arm-trusted-firmware-mediatek/mt7981-spim-nand-ddr4/compile V=s -j$(nproc)
          make package/boot/uboot-mediatek/mt7981-spim-nand-ddr4/compile V=s -j$(nproc)
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-DDR4-Unbrick-Payload
          path: |
            openwrt/bin/targets/mediatek/filogic/*-bl2.img
            openwrt/bin/targets/mediatek/filogic/*-fip.bin
