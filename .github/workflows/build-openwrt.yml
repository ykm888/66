name: "SL3000-Final-Build-V9"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理环境初始化与空间清理
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig libpython3-dev qemu-utils libncursesw5-dev liblzma-dev libpam0g-dev libglib2.0-dev libgpiod-dev device-tree-compiler bc python3-yaml python3-setuptools
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: 2. 物理检出主分支
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 3. 物理克隆构建源码 (分支: sl3000-immortalwrt-bootstrap)
        run: |
          git clone --depth 1 -b sl3000-immortalwrt-bootstrap https://github.com/ykm888/66 openwrt

      - name: 4. 物理注入三件套 (DTS/MK)
        run: |
          # 物理覆盖主分支定制的 DTS 和 MK 到源码对应的 files 目录
          mkdir -p openwrt/target/linux/mediatek/files-5.15/arch/arm64/boot/dts/mediatek/
          cp -v custom-config/mt7981-sl-3000-emmc.dts openwrt/target/linux/mediatek/files-5.15/arch/arm64/boot/dts/mediatek/
          cp -v custom-config/filogic.mk openwrt/target/linux/mediatek/image/filogic.mk

      - name: 5. 物理同步 Feeds 与加载配置
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp -v ../custom-config/sl3000.config .config
          {
            echo "CONFIG_TARGET_mediatek=y"
            echo "CONFIG_TARGET_mediatek_filogic=y"
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-nor-emmc=y"
            echo "CONFIG_LINUX_5_15=y"
          } >> .config
          make defconfig
          make download -j8

      - name: 6. 物理构建：全依赖 DTS 强制对齐 (V9 修复点)
        run: |
          cd openwrt
          # 物理安装工具链
          make tools/install -j$(nproc) || make tools/install V=s -j1
          make toolchain/install -j$(nproc) || make toolchain/install V=s -j1
          
          # 物理准备内核
          make target/linux/prepare V=s -j1
          
          # 物理定位内核构建中的 DTS 物理坑位
          KERNEL_DTS_DEST=$(find build_dir/target-aarch64_cortex-a53_musl/ -name "linux-5.15*" -type d | head -n 1)/arch/arm64/boot/dts/mediatek
          SRC_DTS_DIR="target/linux/mediatek/files-5.15/arch/arm64/boot/dts/mediatek"
          
          # 【物理核心修复】将整个 files-5.15 目录下的所有 dtsi 和 dts 强制同步进去
          # 这样 mt7981-sl-3000-emmc.dts 就能看到同级目录的 mt7981.dtsi 了
          if [ -d "$KERNEL_DTS_DEST" ]; then
            echo "物理同步 DTS 依赖项至: $KERNEL_DTS_DEST"
            cp -rv $SRC_DTS_DIR/* "$KERNEL_DTS_DEST/"
          else
            echo "物理报错：找不到内核 DTS 目标目录"
            exit 1
          fi

          # 物理编译引导组件 (产出 bl2.img 和 fip.bin)
          make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
          make package/boot/uboot-mediatek/compile V=s -j1
          
          # 全量物理构建
          make -j$(nproc) || make -j1 V=s

      - name: 7. 物理产出物搜集
        run: |
          cd openwrt
          mkdir -p out_final
          find bin/targets/mediatek/filogic/ -name "*nor-programmer-dump.bin*" -exec cp -v {} out_final/ \;
          find bin/targets/mediatek/filogic/ -name "*emmc-sysupgrade.bin*" -exec cp -v {} out_final/ \;
          [ -d out_final ] && cd out_final && sha256sum * > sha256sums.txt

      - name: 8. 发布 SL3000 终极救砖包
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Final-Rescue-V9
          path: openwrt/out_final/
