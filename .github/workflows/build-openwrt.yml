name: SL3000-1024M-Final-Recovery-Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理环境初始化 (工序一)
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig libpython3-dev qemu-utils
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: 2. 物理克隆固件源码 (工序二)
        run: |
          git clone --depth 1 -b sl3000-padavan-2410 https://github.com/ykm888/66 openwrt

      - name: 3. 物理克隆救砖引导源 (工序三)
        run: |
          git clone --depth 1 -b sl3000-uboot-base https://github.com/ykm888/66 uboot-base

      - name: 4. 物理提取引导文件 (工序四)
        run: |
          # 针对 Cortex-A53 架构的物理路径对齐
          mkdir -p openwrt/staging_dir/target-aarch64_cortex-a53_musl/image/
          cp uboot-base/bl2.bin openwrt/staging_dir/target-aarch64_cortex-a53_musl/image/mt7981-sl3000-bl2.bin || true
          cp uboot-base/fip.bin openwrt/staging_dir/target-aarch64_cortex-a53_musl/image/mt7981-sl3000-fip.bin || true

      - name: 5. 物理更新 Feeds (工序五)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. 物理加载配置与“递归死锁”核心修复 (工序六)
        run: |
          cd openwrt
          # 1. 物理拉取 8000 行配置
          curl -fLo .config https://raw.githubusercontent.com/ykm888/66/main/custom-config/sl3000.config
          
          # 2. 【核心手术】：彻底物理抹除 rd05a1 极其依赖项，终结递归死循环
          sed -i '/CONFIG_PACKAGE_rd05a1/d' .config
          echo "# CONFIG_PACKAGE_rd05a1 is not set" >> .config
          
          # 3. 【核心手术】：物理抹除 datconf，终结 Error 2 下载报错
          sed -i '/CONFIG_PACKAGE_datconf/d' .config
          echo "# CONFIG_PACKAGE_datconf is not set" >> .config
          
          # 4. 【核心对齐】：物理强制锁定 MT7981 架构，防止偏移到 MT7622
          echo "# CONFIG_TARGET_mediatek_mt7622 is not set" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_sl_3000-emmc=y" >> .config
          
          # 5. 【核心注入】：强制开启救砖包（Factory）打包开关
          echo "CONFIG_TARGET_IMAGE_uboot_mediatek_mt7981_sl_3000_emmc=y" >> .config
          
          # 6. 执行物理展开
          make defconfig

      - name: 7. 物理预下载 (工序七)
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: 8. 物理执行构建 (工序八)
        run: |
          cd openwrt
          # 优先使用多线程，报错则自动物理回退单线程 V=s 捕捉
          make -j$(nproc) || make -j1 V=s

      - name: 9. 物理产物整理 (工序九)
        run: |
          cd openwrt
          mkdir -p out_images
          # 物理搜索所有包含 sl_3000 的产物 (factory, sysupgrade, fip等)
          find bin/targets/mediatek/ -name "*sl_3000-emmc*" -exec cp -v {} out_images/ \;

      - name: 10. 物理上传救砖包 (工序十)
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-1024M-Final-Recovery-Pack
          path: openwrt/out_images/
