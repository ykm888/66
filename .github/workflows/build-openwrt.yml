name: SL-3000 Build Unbrick Full-Kit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Initialization Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc wget unzip qemu-utils device-tree-compiler flex bison
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Clone OpenWrt Source
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt -b openwrt-23.05 openwrt

      - name: Prepare Source for DIY
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          make defconfig
          # 物理触发源码解压，生成 build_dir 路径
          make package/boot/arm-trusted-firmware-mediatek/prepare V=s
          make package/boot/uboot-mediatek/prepare V=s

      - name: Execute DIY Script
        run: |
          # 物理搬运脚本与 888 零件
          cp main-repo/diy-part2.sh .
          cp -r main-repo/888 .
          chmod +x diy-part2.sh
          cd openwrt && ../diy-part2.sh

      - name: Build Toolchain
        working-directory: ./openwrt
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: Compile Unbrick Kit
        working-directory: ./openwrt
        run: |
          # 物理执行最终编译
          make package/boot/arm-trusted-firmware-mediatek/compile V=s -j$(nproc)
          make package/boot/uboot-mediatek/compile V=s -j$(nproc)
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Final-Binary
          path: openwrt/bin/targets/mediatek/filogic/*
