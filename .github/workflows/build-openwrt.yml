name: SL-3000-RECOVERY-23.05-FINAL

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理检出代码
        uses: actions/checkout@v4

      - name: 环境筑基 (Ubuntu 22.04)
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo apt-get update
          sudo apt-get install -y build-essential git gawk libncurses5-dev gettext libssl-dev xsltproc wget zstd curl
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: 更新并安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 零件物理预埋 (执行 diy-part2.sh)
        run: |
          chmod +x diy-part2.sh
          ./diy-part2.sh

      - name: 生成 .config 锚点
        run: |
          cd openwrt
          # 优先使用 888 目录中的全量配置，如果没有则使用 diy-part2 注入的配置
          [ -f ../888/sl3000.config ] && cp -f ../888/sl3000.config .config
          make defconfig

      - name: 磨刀 (编译工具链)
        run: |
          cd openwrt
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 强灌与炼化 (编译 ATF 和 U-Boot)
        run: |
          cd openwrt
          # 23.05 环境下强制单线程编译，确保 Makefile 的强灌指令不被跳过
          make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
          make package/boot/uboot-mediatek/compile V=s -j1

      - name: 产物物理提取
        run: |
          mkdir -p outputs
          # 扫描编译生成的二进制零件
          find openwrt/bin/targets/mediatek/filogic/ -name "*bl2*" -exec cp -v {} outputs/ \;
          find openwrt/bin/targets/mediatek/filogic/ -name "*fip*" -exec cp -v {} outputs/ \;
          # 从构建目录抢救原始镜像 (防止 bin 目录未生成)
          find openwrt/build_dir/target-aarch64* -name "bl2.img" -exec cp -v {} outputs/ \;
          find openwrt/build_dir/target-aarch64* -name "u-boot.bin" -exec cp -v {} outputs/ \;
          ls -lh outputs/

      - name: 上传 1MB 偏移救砖固件
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Final-Artifacts
          path: outputs/
