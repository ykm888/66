name: SL3000 救砖全家桶构建

on:
  workflow_dispatch:
  push:
    tags: [ 'brick-v*' ]

jobs:
  build-brick:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 配置仓库(main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Checkout 源码仓库(uboot/atf)
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: 安装依赖
        run: sudo apt update && sudo apt install -y gcc-aarch64-linux-gnu make libssl-dev

      - name: 运行 part1（环境）
        run: |
          chmod +x main-repo/diy-part1.sh
          cd main-repo
          ./diy-part1.sh

      - name: 运行 part2（仅编译救砖包）
        run: |
          chmod +x main-repo/diy-part2.sh
          cd main-repo
          ./diy-part2.sh

      - name: 展示文件
        run: ls -lh $GITHUB_WORKSPACE/output/{atf,uboot}

      - name: 发布救砖包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: brick-${{ github.run_number }}
          name: SL3000 救砖全家桶
          body: |
            - ATF (bl2 + fip)
            - U-Boot
            - mtk_uartboot 串口救砖工具
          files: |
            output/atf/*.bin
            output/uboot/*.bin
            output/mtk_uartboot.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
