name: Build SL-3000 Firmware

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  CONFIG_FILE: 888/sl3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Main (The Command Center)
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        # 物理修正：补齐编译 ATF/DTS 必需的零件编译器 (dtc)
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204) device-tree-compiler
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone OS Source (The Foundation)
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        # 物理关键：将 888 目录下的 9 个核心零件物理注入到编译环境
        cp -r 888 openwrt/
        cp $DIY_P1_SH openwrt/
        cp $DIY_P2_SH openwrt/

    - name: Load Custom Feeds & Scripts
      working-directory: ./openwrt
      run: |
        chmod +x $DIY_P1_SH
        ./$DIY_P1_SH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Configuration & Physical Stitching
      working-directory: ./openwrt
      run: |
        # 物理复刻：优先使用 888 目录下的 config 配置
        [ -f 888/sl3000.config ] && cp 888/sl3000.config .config
        chmod +x $DIY_P2_SH
        # 执行第 14 版脚本，完成全零件拉起
        ./$DIY_P2_SH

    - name: Download Packages
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread compile"
        # 物理防御：一旦失败自动开启详细日志 V=s 模式
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_SL3000_Firmware
        path: openwrt/bin/targets/mediatek/filogic/*
