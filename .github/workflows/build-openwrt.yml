name: SL-3000-DDR4-24.10-Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hardened Parts
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Initialize Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc wget unzip qemu-utils device-tree-compiler flex bison
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt -b openwrt-24.10 openwrt

      - name: Physical Force Sync & Index Reset
        run: |
          # 1. 物理替换 Makefile
          cp -v main-repo/888/atf-Makefile openwrt/package/boot/arm-trusted-firmware-mediatek/Makefile
          cp -v main-repo/888/uboot-Makefile openwrt/package/boot/uboot-mediatek/Makefile
          
          # 2. 【核心修复】摧毁旧索引，迫使系统读取新定义的 mt7981-sl3000-nor
          rm -rf openwrt/tmp
          
          # 3. 注入初始配置
          cd openwrt
          ./scripts/feeds update -a && ./scripts/feeds install -a
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_mediatek_mt7981-rfb-flash=y" >> .config
          
          # 4. 强制开启变体
          echo "CONFIG_PACKAGE_arm-trusted-firmware-mediatek-mt7981-sl3000-nor=y" >> .config
          make defconfig

      - name: Physical Pull-up & Inject
        run: |
          # 5. 执行你的 24.10 物理拉起脚本
          chmod +x main-repo/diy-part2.sh
          ./main-repo/diy-part2.sh

      - name: Final Compile
        working-directory: ./openwrt
        run: |
          # 6. 物理对齐编译：名称必须与 atf-Makefile 像素级一致
          make package/boot/arm-trusted-firmware-mediatek/mt7981-sl3000-nor/compile V=s -j$(nproc)
          make package/boot/uboot-mediatek/mt7981-spim-nand-ddr4/compile V=s -j$(nproc)

      - name: Upload Unbrick Payload
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-24.10-Payload
          path: openwrt/bin/targets/mediatek/filogic/
