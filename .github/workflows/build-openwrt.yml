name: SL-3000-PHYSICAL-FINAL-BUILD

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66.git
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理检出当前仓库
        uses: actions/checkout@v4

      - name: 环境筑基 (安装依赖与克隆系统)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gawk libncurses5-dev gettext libssl-dev xsltproc wget zstd curl python3-pyelftools
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: Feeds 同步
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 零件全链路物理强灌
        run: |
          chmod +x diy-part2.sh
          ./diy-part2.sh

      - name: 磨刀 (工具链编译)
        run: |
          cd openwrt
          # 预生成配置并强制补强变体名
          make defconfig
          echo "CONFIG_PACKAGE_arm-trusted-firmware-mediatek-mt7981-nor-ddr4=y" >> .config
          echo "CONFIG_PACKAGE_uboot-mediatek-mt7981_sl3000=y" >> .config
          
          # 编译基础工具链 (MT7981 必须)
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 强灌与炼化 (物理强制路径编译)
        run: |
          cd openwrt
          # [核心对齐]：指名道姓强制编译新变体，无视 Skipping
          make package/boot/arm-trusted-firmware-mediatek/mt7981-nor-ddr4/compile V=s -j1
          make package/boot/uboot-mediatek/mt7981_sl3000/compile V=s -j1

      - name: 产物暴力搜救与提取
        if: always()
        run: |
          mkdir -p outputs
          # 1. 优先打捞 Makefile 中定义的 recovery 专用目录
          if [ -d "openwrt/bin/sl3000-recovery" ]; then
            cp -v openwrt/bin/sl3000-recovery/* outputs/
          fi
          
          # 2. 备选方案：全盘打捞防漏掉
          find openwrt/build_dir/ -type f \( -name "bl2.img" -o -name "fip.bin" -o -name "u-boot.bin" -o -name "*mt7981-nor-ddr4*" \) -exec cp -v {} outputs/ \;
          
          echo "--- [搜救结果展示] ---"
          ls -R outputs/

      - name: 上传 1MB 救砖黄金镜像
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-1MB-Recovery-Package
          path: outputs/
