name: SL3000-eMMC-Final-Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.sh'
      - '**.dts'
      - '**.mk'
      - '**.config'
      - '.github/workflows/**'
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo (scripts + dts + config)
        uses: actions/checkout@v4

      - name: Checkout OpenWrt source
        uses: actions/checkout@v4
        with:
          repository: ykm888/66
          ref: 2410
          path: openwrt

      - name: Clean disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext \
            git libncurses-dev libssl-dev python3-distutils \
            python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Run diy-part1.sh
        run: |
          chmod +x diy-part1.sh
          ./diy-part1.sh
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Run diy-part2.sh
        run: |
          chmod +x diy-part2.sh
          ./diy-part2.sh
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Build firmware
        run: |
          cd "${GITHUB_WORKSPACE}/openwrt"
          make -j$(nproc) V=s

      - name: Generate release tag
        id: tag
        run: echo "release_tag=SL3000-eMMC-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: SL3000 eMMC 救砖固件 ${{ steps.tag.outputs.release_tag }}
          body: |
            设备：司络 SL3000 MT7981B
            启动：eMMC
            内存：1GB
          files: |
            ${{ github.workspace }}/openwrt/bin/targets/mediatek/filogic/*.bin
            ${{ github.workspace }}/openwrt/bin/targets/mediatek/filogic/*.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
