name: SL3000-MT7981-Manual
on:
  workflow_dispatch:    # 仅手动点Run

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装编译环境
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev

      - name: 拉OpenWrt源码
        uses: actions/checkout@v4
        with:
          repository: ykm888/66
          ref: 2410-6.6
          path: openwrt

      - name: 执行diy-part1
        run: |
          chmod +x diy-part1.sh
          ./diy-part1.sh

      - name: 执行diy-part2
        run: |
          chmod +x diy-part2.sh
          ./diy-part2.sh

      - name: 开始编译
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: 上传固件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SL3000-$(date +%Y%m%d%H%M)
          files: openwrt/bin/targets/mediatek/filogic/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
