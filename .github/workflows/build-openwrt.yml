name: "OpenWrt Builder SL3000 Final V23"

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 物理检出配置 (main 分支)
      uses: actions/checkout@v4
      with:
        ref: main

    - name: 2. 物理定位核实 (这一步会打印出所有文件，如果不显示 custom-config，说明检出失败)
      run: |
        echo "=== 当前工作目录: $PWD ==="
        echo "=== 根目录文件清单 ==="
        ls -R

    - name: 3. 初始化环境与源码
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo timedatectl set-timezone "$TZ"
        
        # 记录当前的绝对路径
        GLOBAL_WORKSPACE=$PWD
        
        # 克隆源码和 U-Boot
        git clone --depth 1 https://github.com/ykm888/66 -b sl3000-immortalwrt-bootstrap openwrt
        rm -rf openwrt/package/boot/uboot-mediatek/src
        git clone --depth 1 https://github.com/ykm888/66 -b sl3000-uboot-base openwrt/package/boot/uboot-mediatek/src

    - name: 4. 物理强行覆盖 (使用 find 动态定位)
      run: |
        # 无论 custom-config 在哪，强行搜索并定义变量
        CONF_SRC=$(find $PWD -name "custom-config" -type d | head -n 1)
        echo "确定的配置源物理路径: $CONF_SRC"
        
        # 定义目标路径
        DTS_DEST="openwrt/target/linux/mediatek/files-5.15/arch/arm64/boot/dts/mediatek"
        MK_DEST="openwrt/target/linux/mediatek/image/filogic.mk"
        
        # 执行注入
        mkdir -p "$DTS_DEST"
        cp -vf "$CONF_SRC/mt7981-sl-3000-emmc.dts" "$DTS_DEST/"
        cp -vf "$CONF_SRC/filogic.mk" "$MK_DEST"
        cp -vf "$CONF_SRC/sl3000.config" "openwrt/.config"

    - name: 5. 编译准备
      run: |
        cd openwrt
        ./scripts/feeds update -a && ./scripts/feeds install -a
        echo "CONFIG_LINUX_5_15=y" >> .config
        make defconfig
        make tools/install -j$(nproc)
        make toolchain/install -j$(nproc)
        
        # 补齐 5.15 内核依赖
        make target/linux/prepare V=s -j1
        K_DTS=$(find build_dir/ -name "linux-5.15*" -type d | head -n 1)/arch/arm64/boot/dts/mediatek
        cp -rf target/linux/mediatek/files-5.15/arch/arm64/boot/dts/mediatek/* "$K_DTS/"

    - name: 6. 物理构建
      run: |
        cd openwrt
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
        make package/boot/uboot-mediatek/compile V=s -j1
        make -j$(nproc) || make -j1 V=s

    - name: 7. 发布产出
      run: |
        mkdir -p FIRMWARE_OUT
        find openwrt/bin/targets/ -name "*sl_3000*" -exec cp -f {} FIRMWARE_OUT/ \;
        echo "FIRMWARE_DIR=$PWD/FIRMWARE_OUT" >> $GITHUB_ENV

    - name: 8. Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: SL3000_V23_Build
        files: FIRMWARE_OUT/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
