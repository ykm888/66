name: SL3000 Final Build with Auto Release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 1. Checkout Main (Config & Scripts)
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: 2. Checkout Source (Remote Base & ImmortalWrt)
        run: |
          mkdir -p source-repo
          # 拉取别人的底层三件套
          git clone --depth 1 --branch sl3000-full-sync https://github.com/ykm99999/66 source-repo/base
          # 拉取 ImmortalWrt 系统源码
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt immortalwrt-build

      - name: 3. Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev python3-distutils \
            python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: 4. Execution diy-part1.sh (Feeds)
        run: |
          chmod +x main-repo/diy-part1.sh
          cd immortalwrt-build
          $GITHUB_WORKSPACE/main-repo/diy-part1.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 5. Execution diy-part2.sh (Patch & Config)
        run: |
          chmod +x main-repo/diy-part2.sh
          cd immortalwrt-build
          $GITHUB_WORKSPACE/main-repo/diy-part2.sh

      - name: 6. Build OpenWrt System
        run: |
          cd immortalwrt-build
          make defconfig
          # 救砖模式下建议用 -j$(nproc) 快速编译内核
          make -j$(nproc) || make -j1 V=s

      - name: 7. Final Physical Merge (32MB Full Image)
        run: |
          # 物理缝合逻辑：将 ATF, U-Boot 和编译好的 Kernel 拼成一个 32MB 文件
          mkdir -p output/firmware output/atf output/uboot
          
          # 创建空白底图
          tr '\000' '\377' < /dev/zero | dd of=output/Spi-flash-32MB.bin bs=1M count=32
          
          # 写入 BL2 (0偏移) - 假设你在 diy-part2 中已编译好 bl2.img
          dd if=source-repo/base/arm-trusted-firmware/build/mt7981/release/bl2.img of=output/Spi-flash-32MB.bin conv=notrunc
          
          # 写入 FIP (3.5MB偏移 -> seek=3584)
          dd if=source-repo/base/u-boot/fip.bin of=output/Spi-flash-32MB.bin bs=1k seek=3584 conv=notrunc
          
          # 写入编译出的 OpenWrt 系统固件 (5.5MB偏移 -> seek=5632)
          SYS_BIN=$(find immortalwrt-build/bin/targets/ -name "*sysupgrade.bin" | head -1)
          dd if=$SYS_BIN of=output/Spi-flash-32MB.bin bs=1k seek=5632 conv=notrunc
          
          # 复制其他产物用于发布
          cp source-repo/base/arm-trusted-firmware/build/mt7981/release/bl2.img output/atf/
          cp source-repo/base/u-boot/fip.bin output/uboot/
          tar -czf output/mtk_uartboot.tar.gz -C source-repo/base/mtk_uartboot .

      - name: 8. Generate Release Tag
        id: release_tag
        run: |
          TAG_NAME="v$(date +'%Y%m%d-%H%M%S')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: 9. Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "SL3000 Rescue Firmware ${{ steps.release_tag.outputs.tag_name }}"
          body: |
            ### SL3000 (1GB DDR4) 救砖全家桶
            - **物理镜像**: `Spi-flash-32MB.bin` (直接用烧录器刷入)
            - **偏移对齐**: BL2(0M), FIP(3.5M), Kernel(5.5M)
            - **源码补丁**: 已锁定 DDR4 1024MB 内存初始化
          files: |
            output/atf/*.img
            output/uboot/*.bin
            output/firmware/*.bin
            output/mtk_uartboot.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
