name: SL3000 Final Build with Auto Release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # 必须开启写入权限才能创建 Release
    
    steps:
      - name: 1. 拉取主仓库 (脚本与配置)
        uses: actions/checkout@v4
        with:
          path: main-workspace

      - name: 2. 物理全量拉取同步源 (ykm99999/66)
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: main-workspace/source-repo

      - name: 3. 生成版本标签
        id: release_tag
        run: |
          TAG_NAME="v$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG_NAME"

      - name: 4. 安装交叉编译物理依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler u-boot-tools

      - name: 5. 磁盘空间清理
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: 6. 执行 Part 1 (架构锁定与 DTS 注入)
        run: |
          cd main-workspace
          chmod +x diy-part1.sh
          ./diy-part1.sh

      - name: 7. 执行 Part 2 (物理编译与救砖包缝合)
        run: |
          cd main-workspace
          chmod +x diy-part2.sh
          ./diy-part2.sh

      - name: 8. 产物物理对齐检查
        run: |
          cd main-workspace
          echo "=== 检查输出目录结构 ==="
          ls -R output/ || echo "⚠️ 警告: output 目录为空"

      - name: 9. 自动发布 (Create Release)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "SL3000 终极固件全家桶 ${{ steps.release_tag.outputs.tag_name }}"
          body: |
            ## 🚀 SL3000 1GB RAM 物理对齐版本
            - **同步源**: `ykm99999/66` (sl3000-full-sync)
            - **内核**: 6.6 / 24.10 框架
            - **特性**: 1GB DDR4 内存训练、32MB SPI-NOR 救砖缝合
            
            ### 📦 包含文件
            - `atf/`: BL2, FIP 引导零件
            - `uboot/`: U-Boot 原始镜像
            - `firmware/`: Sysupgrade 系统升级包
            - `SL3000_32M_FULL.bin`: 32MB 完整一键救砖包
          files: |
            main-workspace/output/atf/*.bin
            main-workspace/output/uboot/*.bin
            main-workspace/output/firmware/*.bin
            main-workspace/output/*.bin
            main-workspace/output/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 10. 备份产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Kit-${{ steps.release_tag.outputs.tag_name }}
          path: main-workspace/output/
