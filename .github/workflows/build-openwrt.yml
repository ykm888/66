name: SL-3000-DDR4-FINAL-FIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repo
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Initialize Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc wget unzip qemu-utils device-tree-compiler flex bison
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt -b openwrt-23.05 openwrt

      - name: Physical Sync & Clean Path
        run: |
          # 1. 物理替换 Makefile
          cp -v main-repo/888/atf-Makefile openwrt/package/boot/arm-trusted-firmware-mediatek/Makefile
          cp -v main-repo/888/uboot-Makefile openwrt/package/boot/uboot-mediatek/Makefile
          
          # 2. 彻底摧毁索引缓存
          rm -rf openwrt/tmp
          
          cd openwrt
          ./scripts/feeds update -i
          ./scripts/feeds install -a

      - name: Execute Hardened Injection
        run: |
          # 3. 调用清创注入脚本（处理 Patch 冲突并注入零件）
          chmod +x main-repo/diy-part2.sh
          ./main-repo/diy-part2.sh

      - name: Final Compile
        working-directory: ./openwrt
        run: |
          # 4. 锁定配置并物理编译
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_mediatek_mt7981-rfb-flash=y" >> .config
          echo "CONFIG_PACKAGE_arm-trusted-firmware-mediatek-mt7981-sl3000-nor=y" >> .config
          
          make defconfig
          
          # 5. 串行编译确保稳定
          make package/boot/arm-trusted-firmware-mediatek/compile V=s -j$(nproc)
          make package/boot/uboot-mediatek/compile V=s -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Unbrick-Payload
          path: openwrt/bin/targets/mediatek/filogic/
