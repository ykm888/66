name: SL3000 Final Build V1

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Main Branch (Configs)
        uses: actions/checkout@v4
        with:
          # 脚本和 888 文件夹都在这个分支的根目录
          ref: main
          path: main-repo

      - name: Checkout Bootloader Source
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Checkout Firmware Source (Flat Structure)
        uses: actions/checkout@v4
        with:
          repository: ykm888/66
          ref: 2410
          path: firmware-repo

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Run V1 Build Script
        run: |
          # 物理检查：列出 main-repo 内容，确保脚本在这里
          ls -F main-repo/
          
          # 赋予权限并执行
          chmod +x ./main-repo/diy-part1.sh
          ./main-repo/diy-part1.sh
