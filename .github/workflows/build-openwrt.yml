name: SL-3000-RECOVERY-23.05-FINAL

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理检出代码
        uses: actions/checkout@v4

      - name: 环境筑基 (Ubuntu 22.04)
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo apt-get update
          sudo apt-get install -y build-essential git gawk libncurses5-dev gettext libssl-dev xsltproc wget zstd curl
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: 更新并安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 物理零件预埋 (劫持 23.05 Makefile)
        run: |
          # 核心逻辑：在编译开始前，将 888 目录的文件物理投递到 package 层级
          chmod +x diy-part2.sh
          ./diy-part2.sh

      - name: 物理配置对齐
        run: |
          cd openwrt
          # 优先使用你 888 目录里的全量 config
          [ -f ../888/sl3000.config ] && cp -f ../888/sl3000.config .config
          make defconfig

      - name: 编译工具链 (23.05 地基)
        run: |
          cd openwrt
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 物理全链路编译
        run: |
          cd openwrt
          # 23.05 环境下强制单线程编译关键包，确保 log 清晰且不丢包
          make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
          make package/boot/uboot-mediatek/compile V=s -j1

      - name: 物理提取产物
        run: |
          mkdir -p outputs
          # 针对 23.05 的产物路径进行像素级扫描
          find openwrt/bin/targets/mediatek/filogic/ -name "*bl2*" -exec cp -v {} outputs/ \;
          find openwrt/bin/targets/mediatek/filogic/ -name "*fip*" -exec cp -v {} outputs/ \;
          # 双重保险：从构建目录直接抢救原始二进制
          find openwrt/build_dir/target-aarch64* -name "bl2.img" -exec cp -v {} outputs/ \;
          find openwrt/build_dir/target-aarch64* -name "fip.bin" -exec cp -v {} outputs/ \;
          ls -lh outputs/

      - name: 上传 23.05 救砖包
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-23.05-Final-Bin
          path: outputs/
