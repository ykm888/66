name: SL3000 Final Build with Auto Release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main branch (Contains 888/ and diy-scripts)
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout source branch (MTK SDK Source)
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Generate release tag
        id: release_tag
        run: |
          TAG_NAME="v$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG_NAME"

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Optimize Disk Space
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/powershell
          df -h

      - name: Run diy-part1.sh (DTS/Config Injection & Feeds)
        run: |
          # 给予脚本执行权限
          chmod +x main-repo/diy-part1.sh
          # 执行注入逻辑，注意脚本内部路径需指向 source-repo
          cd main-repo
          ./diy-part1.sh

      - name: Run diy-part2.sh (ATF/U-Boot Physics Patch & Build)
        run: |
          chmod +x main-repo/diy-part2.sh
          # 执行底层源码修改逻辑并触发编译
          cd main-repo
          ./diy-part2.sh

      - name: Audit Output Artifacts
        run: |
          echo "=== 🔍 关键产物物理检查 ==="
          ls -R output/ || echo "⚠️ 警告：未发现 output 目录"
          echo "=== 📦 准备发布的文件列表 ==="
          find output/ -type f \( -name "*.bin" -o -name "*.img" -o -name "*.gz" \) | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "SL3000 1GB-32MB Rescue Firmware ${{ steps.release_tag.outputs.tag_name }}"
          body: |
            ## 🚀 SL3000 物理对齐定制版固件
            
            ### 🛠️ 核心修改说明：
            - **内存锁定**: 物理强制训练 **1024MB DDR4** 内存。
            - **寻址修正**: SPI-NOR FIP 偏移像素级对齐至 **3.5MB (0x380000)**。
            - **救砖支持**: 生成 32MB 全量实心包，适用于热风枪直刷或编程器。

            ### 📦 产物说明：
            - `SL3000_1G_RESCUE_32M.bin`: 32MB 全量编程器固件 (包含 BL2+FIP)。
            - `firmware/`: 包含 ImmortalWrt 系统 sysupgrade 镜像。
            - `atf/ & uboot/`: 独立的引导组件产物。
          files: |
            output/rescue/*.bin
            output/atf/*.img
            output/atf/*.bin
            output/uboot/*.bin
            output/firmware/*.bin
            output/firmware/*.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-build-artifacts
          path: output/
          retention-days: 7
