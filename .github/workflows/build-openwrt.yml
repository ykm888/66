name: SL3000救砖全家桶(888目录三件套自动注入)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # 1. 拉 main 分支（里面有 888/三件套）
      - name: 拉取 main 分支（三件套在888目录）
        uses: actions/checkout@v4
        with:
          repository: ykm888/66
          ref: main
          path: main_repo

      # 2. 拉底层源码（atf + u-boot）
      - name: 拉取底层源码 sl3000-clean-source
        uses: actions/checkout@v4
        with:
          repository: ykm888/66
          ref: sl3000-clean-source
          path: src

      # 3. 安装工具
      - name: 安装交叉编译工具
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu make git libssl-dev bison flex

      # ======================
      # 从 main/888/ 复制三件套（绝对不会再找不到）
      # ======================
      - name: 注入 DTS
        run: |
          mkdir -p src/target/linux/mediatek/dts
          cp -vf main_repo/888/mt7981-sl3000-emmc.dts src/target/linux/mediatek/dts/

      - name: 注入 mk
        run: |
          cp -vf main_repo/888/mt7981_sl3000.mk src/target/linux/mediatek/filogic.mk

      - name: 注入 config
        run: |
          cp -vf main_repo/888/sl3000.config src/.config

      # ======================
      # 编译 ATF + U-Boot
      # ======================
      - name: 编译 ATF
        run: |
          cd src/atf
          make CROSS_COMPILE=aarch64-linux-gnu- PLAT=mt7981

      - name: 编译 U-Boot
        run: |
          cd src/u-boot
          make CROSS_COMPILE=aarch64-linux-gnu- mt7981_sl3000_defconfig
          make CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      # ======================
      # 打包救砖文件
      # ======================
      - name: 整理输出
        run: |
          mkdir -p output
          cp src/atf/build/mt7981/release/bl2.bin  output/
          cp src/atf/build/mt7981/release/fip.bin  output/
          cp src/u-boot/u-boot.bin                 output/
          cp src/u-boot/u-boot.itb                 output/

      - name: 发布救砖包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sl3000-boot-$(date +%Y%m%d-%H%M)
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
