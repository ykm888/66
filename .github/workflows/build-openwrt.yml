name: SL3000 Final Build V1

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Main Source (ykm888 2410)
        uses: actions/checkout@v4
        with:
          repository: ykm888/66
          ref: 2410
          # 不再设置 path: main-repo，脚本直接就在根目录

      - name: Checkout Bootloader Source (ykm99999)
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Checkout Firmware Source (ykm888 2410)
        uses: actions/checkout@v4
        with:
          repository: ykm888/66
          ref: 2410
          path: firmware-repo

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Run V1 Build Script
        run: |
          # 脚本就在根目录，直接赋予权限并执行
          chmod +x diy-part1.sh
          ./diy-part1.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-v1-firmware
          path: output/
