name: SL3000-Final-Build-v6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4
        with:
          path: main-workspace

      - name: 2. 检出同步源
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: main-workspace/source-repo

      - name: 3. 物理生成合法 Tag
        id: set_tag
        run: |
          # 预先生成纯数字+字母的合法标签
          TAG="SL3000-V6-$(date +'%Y%m%d-%H%M')"
          echo "tag_id=$TAG" >> $GITHUB_OUTPUT

      - name: 4. 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler u-boot-tools

      - name: 5. 执行 Part 1 & Part 2
        run: |
          cd main-workspace
          chmod +x diy-part1.sh diy-part2.sh
          ./diy-part1.sh
          ./diy-part2.sh

      - name: 6. 物理对齐产物目录
        run: |
          # 强制创建一个平级目录方便发布，防止通配符失效
          mkdir -p main-workspace/deploy
          cp -v main-workspace/output/*.bin main-workspace/deploy/ || true
          # 递归搜寻所有 bin 并放入 deploy
          find main-workspace/output/ -name "*.bin" -exec cp -v {} main-workspace/deploy/ \;

      - name: 7. 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          # 使用步骤 3 生成的合法变量
          tag_name: ${{ steps.set_tag.outputs.tag_id }}
          name: "SL3000 救砖固件 V6 (${{ steps.set_tag.outputs.tag_id }})"
          body: |
            ### 🛠️ 物理修复 V6
            - 修正了 Tag 命名导致的发布失败。
            - 强制对齐了编译产物路径。
            - 建议下载 `SL3000_1GB_RESCUE_32M.bin` 进行编程器烧录。
          files: |
            main-workspace/deploy/*.bin
          token: ${{ secrets.GITHUB_TOKEN }}
