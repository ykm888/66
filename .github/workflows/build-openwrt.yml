name: SL3000 救砖全家桶

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main-repo
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Checkout source-repo
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: 运行 diy-part1.sh
        run: |
          chmod +x main-repo/diy-part1.sh
          cd main-repo
          ./diy-part1.sh

      - name: 运行 diy-part2.sh（只编译救砖）
        run: |
          chmod +x main-repo/diy-part2.sh
          cd main-repo
          ./diy-part2.sh

      - name: 显示文件
        run: ls -lh $GITHUB_WORKSPACE/output/{atf,uboot}

      - name: 发布救砖包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: brick-${{ github.run_id }}
          name: SL3000 救砖包
          files: |
            output/atf/*.bin
            output/atf/*.img
            output/uboot/*.bin
            output/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
