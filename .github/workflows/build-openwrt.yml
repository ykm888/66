name: SL3000-Recovery-Build-Full

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 物理拉取底层救砖仓库源
        run: |
          git clone --depth 1 https://github.com/ykm888/66.git -b sl3000-immortalwrt-bootstrap sl3000-repo

      - name: 环境初始化
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gawk libncurses5-dev gettext libssl-dev xsltproc wget zstd python3-pyelftools
          git clone --depth 1 https://github.com/coolsnowwolf/immortalwrt.git openwrt

      - name: 执行物理修复与合并
        run: |
          cd openwrt
          chmod +x ../diy-part2.sh
          ../diy-part2.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: 物理构建地基 (Tools & Toolchain)
        run: |
          cd openwrt
          # 这是彻底解决 cp: cannot stat ld-musl 的物理唯一解
          echo "开始构建交叉编译器，请耐心等待..."
          make tools/install -j$(nproc) V=s
          make toolchain/install -j$(nproc) V=s

      - name: 零件级物理编译
        run: |
          cd openwrt
          # 此时工具链已物理存在于 staging_dir，可以开始编译零件
          make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
          make package/boot/uboot-mediatek/compile V=s -j1

      - name: 合成 32MB 编程器固件
        run: |
          cd openwrt
          make target/linux/mediatek/image/compile V=s

      - name: 收集救砖产物
        run: |
          mkdir -p bin_out
          find openwrt/bin/targets/ -name "*nor-programmer-dump.bin" -exec cp -v {} bin_out/ \;

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Recovery-Bundle
          path: bin_out/
