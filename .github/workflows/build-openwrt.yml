name: Build SL-3000 (Final-Physics-Lock)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: sl3000-immortalwrt-bootstrap
  CONFIG_FILE: 888/sl3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 检出零件 (Checkout main)
      uses: actions/checkout@v4
      with:
        ref: main

    - name: 2. 准备环境 (Initialization)
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler dos2unix fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgpgme11-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip vim wget xmlto xz-utils zlib1g-dev bc
        sudo timedatectl set-timezone "$TZ"

    - name: 3. 检出工地 (Clone bootstrap source)
      run: git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: 4. 执行 DIY-Part1
      working-directory: openwrt
      run: |
        # 脚本就在 main 分支检出后的当前目录下，所以用 ../
        if [ -f "../$DIY_P1_SH" ]; then
          dos2unix "../$DIY_P1_SH"
          chmod +x "../$DIY_P1_SH"
          ../$DIY_P1_SH
        fi
        true

    - name: 5. 更新 Feeds
      working-directory: openwrt
      run: ./scripts/feeds update -a

    - name: 6. 零件注入与深度清理 (Physical Implantation)
      run: |
        # 第一步：物理清除 bootstrap 源码里的 feeds 冲突件
        rm -rf openwrt/package/feeds/mediatek/arm-trusted-firmware-mediatek
        rm -rf openwrt/package/feeds/mediatek/uboot-mediatek
        
        # 第二步：将 main 分支 888 文件夹里的零件塞进 bootstrap 源码工地
        find openwrt/target/linux/mediatek/ -type d -name "dts" -exec cp -f 888/mt7981-sl-3000-emmc.dts {} \;
        [ -f 888/filogic.mk ] && cp -f 888/filogic.mk openwrt/target/linux/mediatek/image/
        
        # 第三步：物理清理临时索引，确保 bootstrap 自带的 package/boot/ 被识别
        rm -rf openwrt/tmp

    - name: 7. 安装 Feeds 与 DIY-Part2
      working-directory: openwrt
      run: |
        ./scripts/feeds install -a
        if [ -f "../$DIY_P2_SH" ]; then
          dos2unix "../$DIY_P2_SH"
          chmod +x "../$DIY_P2_SH"
          ../$DIY_P2_SH
        fi
        true

    - name: 8. 加载 888 配置并校验
      working-directory: openwrt
      run: |
        if [ -f "../$CONFIG_FILE" ]; then
          cp -f "../$CONFIG_FILE" .config
        fi
        make defconfig

    - name: 9. 编译全家桶 (Compile)
      working-directory: openwrt
      run: |
        make download -j8
        make -j$(nproc) || make -j1 V=s

    - name: 10. 整理输出文件
      run: |
        mkdir -p bin/firmware
        find openwrt/bin/targets/mediatek/filogic/ -name "*nor-programmer-dump.bin" -exec cp -f {} bin/firmware/sl3000-32M-rescue.bin \;
        find openwrt/bin/targets/mediatek/filogic/ -name "*sysupgrade.bin" -exec cp -f {} bin/firmware/ \;
        cp -rf openwrt/bin/targets/mediatek/filogic/sl3000-recovery bin/ 2>/dev/null || true

    - name: 11. 上传固件
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-Rescue-Final
        path: bin/
