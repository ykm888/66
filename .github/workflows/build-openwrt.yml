name: SL-3000-DDR4-ULTIMATE-FIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hardened Parts
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Initialize Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc wget unzip qemu-utils device-tree-compiler flex bison
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt -b openwrt-23.05 openwrt

      - name: Update & Install Feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Physical Force Injection
        run: |
          # 1. 物理覆盖 Makefile：确保系统在扫描前就换成我们的零件
          cp -v main-repo/888/atf-Makefile openwrt/package/boot/arm-trusted-firmware-mediatek/Makefile
          cp -v main-repo/888/uboot-Makefile openwrt/package/boot/uboot-mediatek/Makefile
          
          # 2. 【核心修复】摧毁 OpenWrt 索引缓存，强制重新扫描新 Makefile 规则
          rm -rf openwrt/tmp
          
          # 3. 执行脚本锁定配置
          chmod +x main-repo/diy-part2.sh
          cd openwrt && ../main-repo/diy-part2.sh

      - name: Configure and Lock Variants
        working-directory: ./openwrt
        run: |
          # 强制在 .config 中开启我们定义的变体，防止被自动剔除
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_mediatek_mt7981-rfb-flash=y" >> .config
          echo "CONFIG_PACKAGE_arm-trusted-firmware-mediatek-mt7981-nor-ddr4=y" >> .config
          echo "CONFIG_PACKAGE_uboot-mediatek-mt7981-spim-nand-ddr4=y" >> .config
          
          make defconfig

      - name: Compile Unbrick Payload
        working-directory: ./openwrt
        run: |
          # 物理串行编译，确保依赖关系 100% 正确
          make package/boot/arm-trusted-firmware-mediatek/mt7981-nor-ddr4/compile V=s -j1
          make package/boot/uboot-mediatek/mt7981-spim-nand-ddr4/compile V=s -j1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-DDR4-Hardened-Firmware
          path: |
            openwrt/bin/targets/mediatek/filogic/*-bl2.img
            openwrt/bin/targets/mediatek/filogic/*-fip.bin
