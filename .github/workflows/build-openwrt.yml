name: SL-3000-RECOVERY-FINAL-ATTEMPT

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理检出代码
        uses: actions/checkout@v4

      - name: 环境筑基
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gawk libncurses5-dev gettext libssl-dev xsltproc wget zstd curl
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: 更新 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 零件物理预埋
        run: |
          chmod +x diy-part2.sh
          ./diy-part2.sh

      - name: 生成锚点
        run: |
          cd openwrt
          # 强制将你的配置注入
          [ -f ../888/sl3000.config ] && cp -f ../888/sl3000.config .config
          # 23.05 必须执行此步以激活 Makefile 里的变体
          make defconfig

      - name: 磨刀 (工具链)
        run: |
          cd openwrt
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 强灌与炼化 (单线程极致编译)
        run: |
          cd openwrt
          # 清理并强制重新准备
          make package/boot/arm-trusted-firmware-mediatek/clean
          make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
          
          make package/boot/uboot-mediatek/clean
          make package/boot/uboot-mediatek/compile V=s -j1

      - name: 产物暴力搜救
        if: always()
        run: |
          mkdir -p outputs
          echo "--- [物理溯源]：正在进行全盘地毯式搜索 ---"
          
          # 1. 查找所有可能的目标二进制文件
          # 在 bin 目录下找 (最终产物)
          find openwrt/bin/targets/ -type f \( -name "*bl2*" -o -name "*fip*" -o -name "*u-boot.bin*" \) -exec cp -v {} outputs/ \;
          
          # 2. 如果 bin 目录没抓到，直接去构建目录硬抢 (原始产物)
          if [ -z "$(ls -A outputs)" ]; then
            echo "警告：bin 目录未发现文件，正在从 build_dir 抢救..."
            find openwrt/build_dir/ -type f -name "bl2.img" -exec cp -v {} outputs/ \;
            find openwrt/build_dir/ -type f -name "fip.bin" -exec cp -v {} outputs/ \;
            find openwrt/build_dir/ -type f -name "u-boot.bin" -exec cp -v {} outputs/ \;
          fi
          
          # 3. 打印搜救清单，如果这里还是空的，说明编译根本没运行
          echo "--- [最终搜救清单] ---"
          ls -R outputs/

      - name: 上传救砖固件
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Final-Artifacts
          path: outputs/
          if-no-files-found: error
