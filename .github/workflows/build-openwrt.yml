name: SL-3000-PHYSICAL-PIXEL-FIX

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理核对仓库
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: 物理硬化编译环境
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://raw.githubusercontent.com/P3TERX/Actions-OpenWrt/master/files/debian-pkgs)
          sudo timedatectl set-timezone "$TZ"

      - name: 源码溯源与物理拉起
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          # 准则：先物理覆盖 Makefile，再更新 Feeds
          cp -v main-repo/888/atf-Makefile openwrt/package/boot/arm-trusted-firmware-mediatek/Makefile
          cp -v main-repo/888/uboot-Makefile openwrt/package/boot/uboot-mediatek/Makefile
          cd openwrt
          ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 像素级配置锁死
        run: |
          cd openwrt
          # 溯源修复：物理注入 U-Boot 变体配置
          mkdir -p package/boot/uboot-mediatek/config
          cp -v ../main-repo/888/mt7981_sl3000_defconfig package/boot/uboot-mediatek/config/mt7981_sl3000_defconfig
          
          # 物理隔离 .config，绝对禁止触发 menuconfig
          cat > .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_mediatek_mt7981-rfb-flash=y
          CONFIG_PACKAGE_uboot-mediatek-mt7981_sl3000=y
          CONFIG_PACKAGE_arm-trusted-firmware-mediatek-mt7981-sl3000-nor=y
          EOF
          
          # 非交互式刷入配置
          make defconfig

      - name: 物理零件强灌与地基修筑
        run: |
          # 物理准则：先 prepare 生成路径，再 cp 注入零件
          chmod +x main-repo/diy-part2.sh
          ./main-repo/diy-part2.sh
          
          cd openwrt
          # 锁定地基工具链
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          
          # 物理编译零件
          make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
          make package/boot/uboot-mediatek/compile V=s -j1

      - name: 全链路成品提取
        run: |
          mkdir -p outputs
          # 像素级搜寻：不再信任 bin 目录，直接搜寻构建层
          find openwrt/build_dir/target-aarch64* -name "bl2.img" -exec cp -v {} outputs/ \;
          find openwrt/build_dir/target-aarch64* -name "fip.bin" -exec cp -v {} outputs/ \;
          [ -z "$(ls -A outputs)" ] && exit 1 || ls -lh outputs/

      - name: 上传救砖零件
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-FIRMWARE-FINAL
          path: outputs/
