name: SL3000救砖打包(查目录+稳复制)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # 1. 拉 main（工作流 + 888目录三件套）
      - name: 拉 main 分支
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_repo

      # --------------- 看清楚文件在哪里 ----------------
      - name: 列出 main_repo 所有文件（调试用）
        run: |
          ls -la main_repo
          ls -la main_repo/888 || true

      # 2. 拉底层源码
      - name: 拉底层源码 sl3000-clean-source
        uses: actions/checkout@v4
        with:
          repository: ykm888/66
          ref: sl3000-clean-source
          path: src

      - name: 安装工具
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu make git libssl-dev bison flex

      # ========== 关键：就算找不到也不报错，继续编译 ==========
      - name: 复制DTS（找不到也不中断）
        run: |
          mkdir -p src/target/linux/mediatek/dts
          cp -vf main_repo/888/mt7981-sl3000-emmc.dts src/target/linux/mediatek/dts/ || true

      - name: 复制mk（找不到也不中断）
        run: |
          cp -vf main_repo/888/mt7981_sl3000.mk src/target/linux/mediatek/filogic.mk || true

      - name: 复制config（找不到也不中断）
        run: |
          cp -vf main_repo/888/sl3000.config src/.config || true

      # 编译 ATF + U-Boot
      - name: 编译 ATF
        run: |
          cd src/atf
          make CROSS_COMPILE=aarch64-linux-gnu- PLAT=mt7981

      - name: 编译 U-Boot
        run: |
          cd src/u-boot
          make CROSS_COMPILE=aarch64-linux-gnu- mt7981_sl3000_defconfig || true
          make CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      # 打包
      - name: 打包救砖文件
        run: |
          mkdir -p output
          [ -f src/atf/build/mt7981/release/bl2.bin ] && cp src/atf/build/mt7981/release/bl2.bin output/
          [ -f src/atf/build/mt7981/release/fip.bin ] && cp src/atf/build/mt7981/release/fip.bin output/
          [ -f src/u-boot/u-boot.bin ] && cp src/u-boot/u-boot.bin output/
          [ -f src/u-boot/u-boot.itb ] && cp src/u-boot/u-boot.itb output/

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sl3000-boot-$(date +%Y%m%d-%H%M)
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
