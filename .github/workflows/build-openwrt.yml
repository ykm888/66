name: SL3000-1GB-Final-Build

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. 环境签出 (Config & Scripts)
        uses: actions/checkout@v4
        with:
          path: main

      - name: 2. 源码签出 (Remote Base & OpenWrt)
        run: |
          # 拉取底层三件套 (ATF/U-Boot/UART)
          git clone --depth 1 --branch sl3000-full-sync https://github.com/ykm99999/66 source-repo
          # 拉取 ImmortalWrt 源码
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt immortalwrt-build

      - name: 3. 物理环境准备 (关键：安装编译器)
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev python3-distutils \
            python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler
          sudo timedatectl set-timezone "Asia/Shanghai"
          mkdir -p output

      - name: 4. 执行 diy-part1.sh (Feeds)
        run: |
          chmod +x main/diy-part1.sh
          # 将底层源码移入编译目录统一管理
          mv source-repo immortalwrt-build/source-repo
          cd immortalwrt-build
          $GITHUB_WORKSPACE/main/diy-part1.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 5. 执行 diy-part2.sh (底层编译与 Patch)
        run: |
          chmod +x main/diy-part2.sh
          cd immortalwrt-build
          # 必须在此步骤产出 bl2-nor.bin 和 fip-nor.bin
          $GITHUB_WORKSPACE/main/diy-part2.sh

      - name: 6. 编译 OpenWrt 系统
        run: |
          cd immortalwrt-build
          # 自动应用 8000 行 Config
          [ -f ".config" ] || make defconfig
          make -j$(nproc) || make -j1 V=s

      - name: 7. 像素级物理缝合 (32MB Full Image)
        run: |
          mkdir -p release_output
          SAVE_FILE="release_output/SL3000-1GB-32MB-Full-Flash.bin"
          
          # 溯源审计：检查原材料是否存在且不为0
          if [ ! -s "output/bl2-nor.bin" ] || [ ! -s "output/fip-nor.bin" ]; then
            echo "❌ 物理对齐失败：底层引导文件缺失！"; exit 1
          fi

          # 创建 32MB 实心底图 (FF填充)
          tr '\000' '\377' < /dev/zero | dd of=$SAVE_FILE bs=1M count=32
          
          # 缝合：BL2(0M), FIP(3.5M/3584K), Kernel(5.5M/5632K)
          dd if=output/bl2-nor.bin of=$SAVE_FILE conv=notrunc
          dd if=output/fip-nor.bin of=$SAVE_FILE bs=1k seek=3584 conv=notrunc
          
          # 搜索系统固件并缝合
          SYS_BIN=$(find immortalwrt-build/bin/targets/ -name "*sysupgrade.bin" | head -1)
          if [ -s "$SYS_BIN" ]; then
              dd if=$SYS_BIN of=$SAVE_FILE bs=1k seek=5632 conv=notrunc
              cp $SYS_BIN release_output/
          fi
          
          # 复制引导文件备份
          cp output/*.bin release_output/

      - name: 8. 自动发布 Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: SL3000-Build-$(date +'%Y%m%d')
          name: "SL3000 (1GB DDR4) 救砖固件"
          files: release_output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
