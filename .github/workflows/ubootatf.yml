name: Sync Hanwckf Source (No Build)

on:
  workflow_dispatch: # 手动物理拉起

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授予物理写入权限

    steps:
      - name: 1. Checkout Your Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Physical Clone Remote Source
        run: |
          # 物理隔离：在临时目录克隆目标仓库
          git clone --depth 1 https://github.com/hanwckf/bl-mt798x.git remote-source
          
      - name: 3. Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 4. Create and Populate New Branch
        run: |
          # 定义物理分支名称
          BRANCH_NAME="hanwckf-stable-source"
          
          # 物理检查：如果分支已存在则删除，确保干净同步
          git push origin --delete $BRANCH_NAME || true
          
          # 创建孤立分支（不带历史记录，保持源码纯净）
          git checkout --orphan $BRANCH_NAME
          
          # 物理清空当前索引
          git rm -rf .
          
          # 将 remote-source 内容物理移动到当前目录
          cp -rf remote-source/* .
          rm -rf remote-source
          
          # 物理提交
          git add .
          git commit -m "Physical Sync from hanwckf/bl-mt798x at $(date +'%Y-%m-%d %H:%M:%S')"
          
      - name: 5. Push to Your Repository
        run: |
          # 物理推送到你的仓库
          git push origin hanwckf-stable-source --force
