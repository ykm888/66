name: "SL3000-Sync-Config-To-Main-V44"

on:
  workflow_dispatch:

jobs:
  sync_to_main:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理克隆主仓库 (main)
        run: |
          # 克隆 main 分支作为基础
          git clone -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ykm888/66.git repo-main

      - name: 2. 物理提取开发分支的配置文件
        run: |
          # 物理获取开发分支中的 sl3000.config 文件内容
          curl -L https://raw.githubusercontent.com/ykm888/66/sl3000-immortalwrt-bootstrap/custom-config/sl3000.config -o sl3000.config.tmp
          
          # 物理检查：如果文件为空或下载失败则停止
          if [ ! -s sl3000.config.tmp ]; then
            echo "物理错误：未能在开发分支找到配置文件！"
            exit 1
          fi

      - name: 3. 物理注入并推送至 main 分支
        run: |
          cd repo-main
          # 确保目标文件夹存在
          mkdir -p custom-config/
          
          # 物理覆盖 main 分支的文件
          cp ../sl3000.config.tmp custom-config/sl3000.config
          
          git config user.name "SL3000-Main-Sync-Bot"
          git config user.email "bot@github.com"
          git add .
          
          # 物理检查是否有变化
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: 从开发分支物理同步最新 1024M 配置至 main"
            git push origin main
            echo "物理同步完成！"
          else
            echo "文件内容一致，无需重复推送。"
          fi
