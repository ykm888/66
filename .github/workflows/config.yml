name: "SL3000-Main-Self-Update-V62"

on:
  workflow_dispatch:

jobs:
  sync_and_push:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理检出当前分支 (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 2. 物理跨分支拉取最新核心组件
        run: |
          # 物理抓取：开发分支的 Config
          curl -L https://raw.githubusercontent.com/ykm888/66/sl3000-immortalwrt-bootstrap/custom-config/sl3000.config -o custom-config/sl3000.config
          
          # 物理抓取：开发分支的 5.15 专用 DTS
          mkdir -p target/linux/mediatek/files-5.15/arch/arm64/boot/dts/mediatek/
          curl -L https://raw.githubusercontent.com/ykm888/66/sl3000-immortalwrt-bootstrap/target/linux/mediatek/files-5.15/arch/arm64/boot/dts/mediatek/mt7981-sl-3000-emmc.dts -o target/linux/mediatek/files-5.15/arch/arm64/boot/dts/mediatek/mt7981-sl-3000-emmc.dts
          
          # 物理抓取：开发分支的 MK 逻辑 (包含 V60 的 32MB 救砖定义)
          mkdir -p target/linux/mediatek/image/
          curl -L https://raw.githubusercontent.com/ykm888/66/sl3000-immortalwrt-bootstrap/target/linux/mediatek/image/filogic.mk -o target/linux/mediatek/image/filogic.mk

      - name: 3. 物理检测并同步回仓库
        run: |
          git config user.name "SL3000-Sync-Bot"
          git config user.email "bot@github.com"
          
          # 物理检查是否有变化
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: 物理对齐开发分支的 1024M 核心组件 (DTS/MK/Config)"
            git push origin main
            echo "物理同步成功！"
          else
            echo "物理文件已是最新，无需更新。"
          fi
