name: "SL3000-Physical-Final-V29"

on:
  workflow_dispatch: # 手动触发

jobs:
  generate_config:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理环境初始化
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential flex bison g++ gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig
          
          # 克隆你锁定的 1024M 适配分支
          git clone --depth 1 -b sl3000-immortalwrt-bootstrap https://github.com/ykm888/66 openwrt

      - name: 2. 物理全同步与强制重索引
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 【物理手术 1】将所有 Makefile 中的双空格强制转换为 Tab（Makefile 物理准则）
          # 这一步能解决 "does not exist" 的缩进识别问题
          find package/boot/ -name "Makefile" -exec sed -i 's/^  /\t/g' {} +
          
          # 【物理手术 2】深度清理旧索引缓存
          rm -rf tmp

      - name: 3. 物理配置注入与依赖闭环
        run: |
          cd openwrt
          # 1. 锁定硬件架构
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_sl_3000-emmc=y" >> .config
          
          # 2. 注入你修改后的物理目标（TF-A & U-Boot）
          echo "CONFIG_PACKAGE_trusted-firmware-a-mt7981-nor-ddr4=y" >> .config
          echo "CONFIG_PACKAGE_uboot-mediatek-mt7981_sl_3000-nor=y" >> .config
          
          # 3. 开启核心物理功能
          echo "CONFIG_MTK_BOOT_PARTITION=y" >> .config
          echo "CONFIG_MTK_WEB_FAILSAFE=y" >> .config
          echo "CONFIG_EFI_PARTITION=y" >> .config
          
          # 4. 自动补全并校验（如果不再报 WARNING，说明物理识别成功）
          make defconfig

      - name: 4. 物理推送到仓库 main 分支
        run: |
          # 准备存放配置的目录
          git clone -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ykm888/66.git repo-main
          mkdir -p repo-main/custom-config/
          
          # 导出生成的 1024M 专用配置
          cp openwrt/.config repo-main/custom-config/sl3000.config
          
          cd repo-main
          git config --global user.email "bot@github.com"
          git config --global user.name "SL3000-Physical-Bot"
          
          git add custom-config/sl3000.config
          
          # 检查物理变动并提交
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: 物理对齐 V29 - 修正 Makefile 缩进并导出 1024M 配置"
            git push origin main
          fi
