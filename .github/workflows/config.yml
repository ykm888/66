name: SL3000-FullConfig-Generator-v3.2

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理环境初始化 (工序一)
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential flex bison g++ gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: 2. 物理克隆固件源码 (工序二)
        run: |
          # 物理锁定包含 1024M 修改的分支作为配置基准
          git clone --depth 1 -b sl3000-padavan-2410 https://github.com/ykm888/66 openwrt

      - name: 3. 物理更新 Feeds (工序三)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4. 物理注入种子配置并执行“全量膨胀” (工序四)
        run: |
          cd openwrt
          # 物理拉取你目前 main 分支下的原始配置
          curl -fLo .config https://raw.githubusercontent.com/ykm888/66/main/custom-config/sl3000.config
          
          # 【物理定点修复】：强制切断导致死循环的递归依赖
          sed -i 's/CONFIG_PACKAGE_rd05a1=y/# CONFIG_PACKAGE_rd05a1 is not set/g' .config
          
          # 【核心物理工序】：执行 oldconfig 并强制接受所有默认值
          # 这会将几百行物理展开为 8000+ 行，包含你要求的 # CONFIG_TARGET_xxx is not set 样式
          make oldconfig < /dev/null
          
          # 物理校验：确认文件头部是否包含全量标识
          head -n 30 .config

      - name: 5. 物理反向推送至 Main 分支 (工序五)
        run: |
          # 物理授权并克隆
          git clone -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ykm888/66.git repo-main
          
          # 物理替换
          cp openwrt/.config repo-main/custom-config/sl3000.config
          
          cd repo-main
          git config --global user.email "bot@github.com"
          git config --global user.name "SL3000-FullConfig-Bot"
          
          git add custom-config/sl3000.config
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: 物理生成 8000 行全量配置样式 [v3.2]"
            git push origin main
          else
            echo "没有物理变化，跳过推送"
          fi
