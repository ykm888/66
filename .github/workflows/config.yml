name: "SL3000-Wipe-and-Rebuild-Config-V32"

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理环境初始化 (工序一)
        run: sudo apt-get update && sudo apt-get install build-essential git libncurses5-dev libssl-dev swig -y

      - name: 2. 源码物理克隆 (工序二)
        run: git clone --depth 1 -b sl3000-immortalwrt-bootstrap https://github.com/ykm888/66 openwrt

      - name: 3. 物理修复 Makefile 结构 (工序三)
        # 这是重构成功的先决条件：必须让系统先“认出”mt7981-nor-ddr4
        run: |
          cd openwrt
          # 修正缩进为 Tab
          sed -i 's/^  /\t/g' package/boot/arm-trusted-firmware-mediatek/Makefile
          # 补齐之前被截断的目标列表结尾，确保注册列表闭合
          sed -i 's/mt7988-spim-nand-$/mt7988-spim-nand-comb/g' package/boot/arm-trusted-firmware-mediatek/Makefile
          # 确保末尾有 eval 调用
          if ! grep -q "BuildPackage/Trusted-Firmware-A" package/boot/arm-trusted-firmware-mediatek/Makefile; then
            echo '$(eval $(call BuildPackage/Trusted-Firmware-A))' >> package/boot/arm-trusted-firmware-mediatek/Makefile
          fi

      - name: 4. 彻底物理清理索引 (工序四)
        # 清空索引，强迫系统扫描修复后的 Makefile
        run: cd openwrt && rm -rf tmp

      - name: 5. 物理同步 Feeds (工序五)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. 物理注入 1024M 核心种子 (工序六)
        run: |
          cd openwrt
          # 由于你清空了远程配置，我们在这里重新建立物理锚点
          cat <<EOF > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y
          CONFIG_PACKAGE_trusted-firmware-a-mt7981-nor-ddr4=y
          CONFIG_PACKAGE_uboot-mediatek-mt7981_sl_3000-nor=y
          CONFIG_PACKAGE_kmod-mtk-hnat=y
          EOF

      - name: 7. 执行全量配置展开 (工序七)
        # 这一步会将几行种子配置膨胀为支持 SL-3000 的几千行完整配置
        run: cd openwrt && make defconfig

      - name: 8. 物理结果核验 (工序八)
        run: |
          mkdir -p config_out
          cp openwrt/.config config_out/sl3000.config
          echo "--- 物理验证：检查 1024M 标记是否成功生成 ---"
          grep "CONFIG_PACKAGE_trusted-firmware-a-mt7981-nor-ddr4=y" config_out/sl3000.config || (echo "错误：配置未能正确生成，请检查 Makefile" && exit 1)

      - name: 9. 物理同步至主仓库 (工序九)
        run: |
          git clone -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ykm888/66.git repo-main
          cp config_out/sl3000.config repo-main/custom-config/sl3000.config
          cd repo-main
          git config user.name "SL3000-Config-Bot"
          git config user.email "bot@github.com"

      - name: 10. 物理提交覆盖 (工序十)
        run: |
          cd repo-main
          git add custom-config/sl3000.config
          git commit -m "chore: 物理重构 SL3000 全量 1024M 纯净配置" || exit 0
          git push origin main
