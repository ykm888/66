name: "SL3000-1024M-Full-Recovery-V23"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理环境初始化
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential flex bison g++ gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig
          # 拉取专用 Bootstrap 分支
          git clone --depth 1 -b sl3000-immortalwrt-bootstrap https://github.com/ykm888/66 openwrt

      - name: 2. 物理注入 1024M 核心补丁 (使用 echo 模式)
        run: |
          cd openwrt
          # A. 物理注入 U-Boot Makefile
          UBOOT_MK="package/boot/uboot-mediatek/Makefile"
          mkdir -p $(dirname $UBOOT_MK)
          echo 'include $(TOPDIR)/rules.mk' > $UBOOT_MK
          echo 'include $(INCLUDE_DIR)/kernel.mk' >> $UBOOT_MK
          echo 'PKG_NAME:=uboot-mediatek' >> $UBOOT_MK
          echo 'PKG_VERSION:=2024.10' >> $UBOOT_MK
          echo 'PKG_SOURCE_PROTO:=git' >> $UBOOT_MK
          echo 'PKG_SOURCE_URL:=https://github.com/ykm888/66.git' >> $UBOOT_MK
          echo 'PKG_SOURCE_VERSION:=sl3000-uboot-base' >> $UBOOT_MK
          echo 'include $(INCLUDE_DIR)/u-boot.mk' >> $UBOOT_MK
          echo 'include $(INCLUDE_DIR)/package.mk' >> $UBOOT_MK
          echo 'define U-Boot/mt7981_sl_3000-emmc' >> $UBOOT_MK
          echo '  NAME:=SL-3000 (DDR4-1024M-eMMC)' >> $UBOOT_MK
          echo '  UBOOT_CONFIG:=mt7981_emmc' >> $UBOOT_MK
          echo '  BL2_DDRTYPE:=ddr4' >> $UBOOT_MK
          echo '  DEPENDS:=+trusted-firmware-a-mt7981-emmc-ddr4' >> $UBOOT_MK
          echo 'endef' >> $UBOOT_MK
          echo 'UBOOT_TARGETS := mt7981_sl_3000-emmc' >> $UBOOT_MK
          echo 'define Package/u-boot-mediatek/install' >> $UBOOT_MK
          echo $'\t''$(INSTALL_DIR) $(STAGING_DIR_IMAGE)' >> $UBOOT_MK
          echo $'\t''$(CP) $(PKG_BUILD_DIR)/mt7981_sl_3000-emmc-u-boot.fip $(STAGING_DIR_IMAGE)/' >> $UBOOT_MK
          echo 'endef' >> $UBOOT_MK
          echo '$(eval $(call BuildPackage/U-Boot))' >> $UBOOT_MK

          # B. 物理锁定 1024M 内存 DTS (路径对齐)
          DTS_FILE="target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-sl-3000-emmc.dts"
          mkdir -p $(dirname $DTS_FILE)
          echo '/dts-v1/;' > $DTS_FILE
          echo '#include "mt7981.dtsi"' >> $DTS_FILE
          echo '/ { model = "SL-3000 1024M"; compatible = "sl,3000-emmc", "mediatek,mt7981";' >> $DTS_FILE
          echo 'memory { device_type = "memory"; reg = <0 0x40000000 0 0x40000000>; }; };' >> $DTS_FILE

      - name: 3. 物理同步配置与依赖加固
        run: |
          cd openwrt
          # 物理同步你的远程配置
          curl -sSL https://raw.githubusercontent.com/ykm888/66/main/custom-config/sl3000.config > .config
          
          # 物理加固：锁定 2500M 全速驱动与硬件加速
          {
            echo "CONFIG_PACKAGE_kmod-mtk-hnat=y"
            echo "CONFIG_PACKAGE_kmod-mt7531=y"
            echo "CONFIG_PACKAGE_kmod-mmc-mtk=y"
            echo "CONFIG_TARGET_ROOTFS_PARTSIZE=512"
            echo "CONFIG_TARGET_IMAGES_GZ=y"
          } >> .config
          
          # 物理修复：剔除低内存限制，释放 1GB 潜能
          sed -i '/CONFIG_LOW_MEMORY_FOOTPRINT/d' .config
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 物理补全缺失的核心依赖库
          ./scripts/feeds install libcrypt-compat libpcre libmpfr btrfs-progs
          
          make defconfig

      - name: 4. 物理多线程编译
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 5. 物理上传救砖全家桶 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-1024M-Final-Firmware
          path: |
            openwrt/bin/targets/mediatek/filogic/*.bin
            openwrt/bin/targets/mediatek/filogic/*.gz
