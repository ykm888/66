name: "SL3000-Full-Config-Recovery-V30"

on:
  workflow_dispatch:

jobs:
  recovery:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理环境初始化 (工序一)
        run: sudo apt-get update && sudo apt-get install build-essential git libncurses5-dev libssl-dev swig -y

      - name: 2. 物理克隆源码 (工序二)
        run: git clone --depth 1 -b sl3000-immortalwrt-bootstrap https://github.com/ykm888/66 openwrt

      - name: 3. 物理修复 Makefile (工序三)
        run: |
          cd openwrt
          # 1. 强制将所有 2 空格缩进转为 1 个 Tab (OpenWrt 解析物理准则)
          sed -i 's/^  /\t/g' package/boot/arm-trusted-firmware-mediatek/Makefile
          # 2. 修复 TFA_TARGETS 列表截断，确保列表闭合
          sed -i 's/mt7988-spim-nand-$/mt7988-spim-nand-comb/g' package/boot/arm-trusted-firmware-mediatek/Makefile
          # 3. 物理补全结尾触发宏，如果没有这一行，defconfig 永远读不到内容
          grep -q "BuildPackage/Trusted-Firmware-A" package/boot/arm-trusted-firmware-mediatek/Makefile || echo '$(eval $(call BuildPackage/Trusted-Firmware-A))' >> package/boot/arm-trusted-firmware-mediatek/Makefile

      - name: 4. 强制物理清理索引 (工序四)
        run: cd openwrt && rm -rf tmp

      - name: 5. 物理同步 Feeds (工序五)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. 物理注入 1024M 种子配置 (工序六)
        run: |
          cd openwrt
          # 这一步是告诉系统：我要编译 SL-3000 的 eMMC 版，并且指定要 DDR4 的引导包
          cat <<EOF > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y
          CONFIG_PACKAGE_trusted-firmware-a-mt7981-nor-ddr4=y
          CONFIG_PACKAGE_uboot-mediatek-mt7981_sl_3000-nor=y
          EOF

      - name: 7. 物理全量展开 (工序七)
        run: |
          cd openwrt
          # 核心工序：系统会根据种子配置，物理补全所有成千上万行的默认依赖配置
          make defconfig

      - name: 8. 物理配置提取 (工序八)
        run: |
          mkdir -p config_out
          # 验证生成的配置是否包含关键的 =y 开关
          if grep -q "CONFIG_PACKAGE_trusted-firmware-a-mt7981-nor-ddr4=y" openwrt/.config; then
            echo "物理验证：1024M DDR4 配置已成功生成！"
          else
            echo "物理验证：警告！配置仍未成功选中，请检查 Makefile。"
          fi
          cp openwrt/.config config_out/sl3000.config

      - name: 9. 物理准备推送 (工序九)
        run: |
          git clone -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ykm888/66.git repo-main
          cp config_out/sl3000.config repo-main/custom-config/sl3000.config
          cd repo-main
          git config user.name "SL3000-Bot"
          git config user.email "bot@github.com"

      - name: 10. 物理强制提交覆盖 (工序十)
        run: |
          cd repo-main
          git add custom-config/sl3000.config
          git commit -m "fix: 物理恢复被清空的 SL3000 全量 1024M 配置" || exit 0
          git push origin main
