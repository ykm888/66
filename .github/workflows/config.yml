name: SL3000-Clean-FullConfig-Generator-v3.5

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理环境初始化
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential flex bison g++ gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: 2. 物理克隆源码 (sl3000-padavan-2410)
        run: |
          git clone --depth 1 -b sl3000-padavan-2410 https://github.com/ykm888/66 openwrt

      - name: 3. 物理更新 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4. 物理清空并注入修复后的种子配置 (核心工序)
        run: |
          cd openwrt
          # 物理清空现有的所有配置
          rm -f .config && touch .config
          
          # 注入基础硬件定义
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y" >> .config
          
          # 注入救砖包构建开关
          echo "CONFIG_TARGET_IMAGE_uboot_mediatek_mt7981_sl_3000_emmc=y" >> .config
          
          # 【物理手术】：强制禁用导致编译报错的 datconf 包
          echo "# CONFIG_PACKAGE_datconf is not set" >> .config
          
          # 执行全量膨胀，生成 8000 行样式
          make oldconfig < /dev/null

      - name: 5. 物理验证
        run: |
          cd openwrt
          echo ">>> 检查配置行数："
          wc -l .config
          echo ">>> 检查救砖开关状态："
          grep "CONFIG_TARGET_IMAGE_uboot_mediatek_mt7981_sl_3000_emmc" .config
          echo ">>> 检查 datconf 状态（应显示为 is not set）："
          grep "CONFIG_PACKAGE_datconf" .config

      - name: 6. 物理推送回主分支
        run: |
          git clone -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ykm888/66.git repo-main
          cp openwrt/.config repo-main/custom-config/sl3000.config
          cd repo-main
          git config --global user.email "bot@github.com"
          git config --global user.name "SL3000-FullConfig-Bot"
          git add custom-config/sl3000.config
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: 物理清空并生成 8000 行全量配置 (禁用 datconf) [v3.5]"
            git push origin main
          fi
