name: SL3000-1024M-Full-Config-No-EOF

on:
  workflow_dispatch:

jobs:
  generate-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理环境初始化
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential flex bison g++ gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: 2. 物理克隆源码
        run: |
          git clone --depth 1 -b sl3000-padavan-2410 https://github.com/ykm888/66 openwrt

      - name: 3. 物理同步 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4. 物理注入 Makefile (禁用 EOF，改用 printf)
        run: |
          cd openwrt
          # 使用 printf 将内容物理写入文件，完全避开 EOF 解析风险
          # 注意：Makefile 中的 $ 符号在这里需要写成双美元 $$ 才能正确输出
          printf 'include $(TOPDIR)/rules.mk\n\
          include $(INCLUDE_DIR)/kernel.mk\n\n\
          PKG_VERSION:=2024.10\n\
          PKG_SOURCE_PROTO:=git\n\
          PKG_SOURCE_URL:=https://github.com/ykm888/66.git\n\
          PKG_SOURCE_VERSION:=sl3000-uboot-base\n\
          PKG_MIRROR_HASH:=skip\n\n\
          PKG_BUILD_DEPENDS:=arm-trusted-firmware-tools/host\n\n\
          include $(INCLUDE_DIR)/u-boot.mk\n\
          include $(INCLUDE_DIR)/package.mk\n\n\
          define U-Boot/Default\n\
            BUILD_TARGET:=mediatek\n\
            UBOOT_IMAGE:=u-boot-mtk.bin\n\
          endef\n\n\
          define U-Boot/mt7981_sl_3000-emmc\n\
            NAME:=SL-3000 (eMMC)\n\
            BUILD_SUBTARGET:=filogic\n\
            BUILD_DEVICES:=sl_3000-emmc\n\
            UBOOT_CONFIG:=mt7981_sl_3000-emmc\n\
            UBOOT_IMAGE:=u-boot.fip\n\
            BL2_BOOTDEV:=emmc\n\
            BL2_SOC:=mt7981\n\
            BL2_DDRTYPE:=ddr4\n\
          endef\n\n\
          UBOOT_TARGETS := mt7981_sl_3000-emmc\n\n\
          define Package/u-boot/install/default\n\
          \t$(CP) $(patsubst %,$(PKG_BUILD_DIR)/%,$(UBOOT_IMAGE)) $(1)/\n\
          \t[ -f $(PKG_BUILD_DIR)/bl2.bin ] && $(CP) $(PKG_BUILD_DIR)/bl2.bin $(1)/mt7981-emmc-ddr4-bl2.bin\n\
          \t[ -f $(PKG_BUILD_DIR)/u-boot.fip ] && $(CP) $(PKG_BUILD_DIR)/u-boot.fip $(1)/\n\
          endef\n\n\
          $(eval $(call BuildPackage/U-Boot))\n' > package/boot/uboot-mediatek/Makefile

      - name: 5. 物理生成 8000 行全量配置 (禁用 EOF)
        run: |
          cd openwrt
          find . -type d -name "datconf" -exec rm -rf {} +
          
          rm -f .config && touch .config
          printf 'CONFIG_TARGET_mediatek=y\n\
          CONFIG_TARGET_mediatek_mt7981=y\n\
          CONFIG_TARGET_mediatek_mt7981_DEVICE_sl_3000-emmc=y\n' >> .config
          
          make defconfig
          
          # 救砖开关强制焊死 (改用 printf)
          printf 'CONFIG_TARGET_IMAGE_uboot_mediatek_mt7981_sl_3000_emmc=y\n\
          CONFIG_MTK_BOOT_PARTITION=y\n\
          CONFIG_MTK_WEB_FAILSAFE=y\n\
          CONFIG_MTK_BOOTMENU_MMC=y\n' >> .config
          
          make oldconfig < /dev/null

      - name: 6. 物理推送至仓库
        run: |
          git clone -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ykm888/66.git repo-main
          mkdir -p repo-main/custom-config/
          cp openwrt/.config repo-main/custom-config/sl3000.config
          cd repo-main
          git config --global user.email "bot@github.com"
          git config --global user.name "SL3000-Config-Bot"
          git add custom-config/sl3000.config
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: 物理对齐 SL-3000 1024M 配置 (禁用 EOF 版)"
            git push origin main
          fi
