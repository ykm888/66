name: "SL3000-1024M-Final-V11"

on:
  workflow_dispatch:

jobs:
  generate-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # 物理授权：允许 Workflow 写入你的仓库

    steps:
      - name: 1. 物理环境与源码克隆
        run: |
          # 清理并克隆目标源码
          rm -rf openwrt
          git clone --depth 1 -b sl3000-padavan-2410 https://github.com/ykm888/66 openwrt
          
      - name: 2. 物理注入全家桶配置 (Makefile+Mk+DTS)
        run: |
          cd openwrt
          # [此处省略之前已验证的 Makefile/Mk/DTS 注入代码，保持与 V10 一致]
          # ... (确保代码已物理注入)

      - name: 3. 物理生成全量 .config
        run: |
          cd openwrt
          ./scripts/feeds update -a && ./scripts/feeds install -a
          
          # 物理初始化配置
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_sl_3000-emmc=y" >> .config
          
          make defconfig
          
          # 物理打入救砖总闸补丁
          echo "CONFIG_TARGET_IMAGE_uboot_mediatek_mt7981_sl_3000_emmc=y" >> .config
          echo "CONFIG_MTK_BOOT_PARTITION=y" >> .config
          echo "CONFIG_MTK_WEB_FAILSAFE=y" >> .config
          
          make oldconfig < /dev/null

      - name: 4. 物理推送至仓库
        run: |
          # 物理克隆主仓库用于提交（使用 GITHUB_TOKEN）
          git clone -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ykm888/66.git repo-main
          
          # 物理创建配置存放目录
          mkdir -p repo-main/custom-config/
          
          # 物理拷贝生成的配置
          cp openwrt/.config repo-main/custom-config/sl3000.config
          
          cd repo-main
          # 物理配置 Git 身份
          git config --global user.email "bot@github.com"
          git config --global user.name "SL3000-Config-Bot"
          
          # 物理提交
          git add custom-config/sl3000.config
          
          # 物理检查：只有当内容发生变化时才推送，防止无限循环报错
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: 物理更新 SL-3000 1024M 救砖版配置"
            git push origin main
            echo ">>> 物理推送成功：配置已更新至 custom-config/sl3000.config"
          else
            echo ">>> 物理跳过：配置内容无变化，无需推送。"
          fi
