name: "SL3000-Full-8000-Config-Sync-V69"

on:
  workflow_dispatch: # 手动触发物理全量备份

jobs:
  backup_full_config:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理检出 main 分支
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 2. 物理初始化源码环境
        run: |
          # 物理检出开发分支作为配置基准
          git clone --depth 1 -b sl3000-immortalwrt-bootstrap https://github.com/ykm888/66 openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 3. 物理合成全量 8000 行配置
        run: |
          cd openwrt
          # A. 物理注入核心关键锁点
          cat << 'EOF' > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-nor-emmc=y
          CONFIG_LINUX_5_15=y
          # 锁定物理内存与存储性能组件
          CONFIG_PACKAGE_kmod-mmc-mtk=y
          CONFIG_PACKAGE_kmod-mt7531=y
          CONFIG_PACKAGE_f2fs-tools=y
          EOF
          
          # B. 物理展开：将核心锁点扩充为 8000 行的全量依赖树
          make defconfig

      - name: 4. 物理推送到 main 分支 custom-config/
        run: |
          git config user.name "SL3000-Full-Config-Bot"
          git config user.email "bot@github.com"
          
          mkdir -p custom-config/
          # 物理拷贝全量 .config (这就是那 8000 行文件)
          cp openwrt/.config custom-config/sl3000.config
          
          git add custom-config/sl3000.config
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: 物理备份 8000 行全量依赖配置 (5.15 内核版)"
            git push origin main
            echo "8000 行全量配置已物理就位！"
          else
            echo "配置内容物理一致，无需更新。"
          fi
