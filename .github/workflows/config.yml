name: "SL3000-Total-Fix-V39"

on:
  workflow_dispatch:

jobs:
  repair_and_sync:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理环境初始化 (工序一)
        run: sudo apt-get update && sudo apt-get install build-essential git libncurses5-dev libssl-dev swig -y

      - name: 2. 源码物理克隆 (工序二)
        run: git clone --depth 1 -b sl3000-immortalwrt-bootstrap https://github.com/ykm888/66 openwrt

      - name: 3. 物理彻底覆写 Makefile (工序三 - 强制格式校准)
        # 强制生成包含标准 Tab 缩进的 Makefile，确保 1024M 物理目标被识别
        run: |
          cd openwrt
          cat <<'EOF' > package/boot/arm-trusted-firmware-mediatek/Makefile
          include $(TOPDIR)/rules.mk
          PKG_NAME:=arm-trusted-firmware-mediatek
          PKG_RELEASE:=2
          PKG_SOURCE_PROTO:=git
          PKG_SOURCE_URL=https://github.com/mtk-openwrt/arm-trusted-firmware.git
          PKG_SOURCE_DATE:=2023-07-24
          PKG_SOURCE_VERSION:=00ac6db375b76e57e1f5e9e9bffa033e907c3581
          PKG_MIRROR_HASH:=74fc18395532c4292f530da8d00fa1873ada4e05e600c0077a7b7f85ace0d913
          PKG_MAINTAINER:=Daniel Golle <daniel@makrotopia.org>
          include $(INCLUDE_DIR)/kernel.mk
          include $(INCLUDE_DIR)/trusted-firmware-a.mk
          include $(INCLUDE_DIR)/package.mk

          define Trusted-Firmware-A/Default
            BUILD_TARGET:=mediatek
            TFA_IMAGE:=bl2.img bl31.bin
            PLAT:=mt7981
          endef

          define Trusted-Firmware-A/mt7981-nor-ddr3
            NAME:=MediaTek MT7981 (SPI-NOR, DDR3)
            BOOT_DEVICE:=nor
            BUILD_SUBTARGET:=filogic
            DDR_TYPE:=ddr3
          endef

          define Trusted-Firmware-A/mt7981-nor-ddr4
            NAME:=MediaTek MT7981 (SPI-NOR, DDR4)
            BOOT_DEVICE:=nor
            BUILD_SUBTARGET:=filogic
            DDR_TYPE:=ddr4
          endef

          TFA_TARGETS:= \
          	mt7981-nor-ddr3 \
          	mt7981-nor-ddr4

          TFA_MAKE_FLAGS += \
          	BOOT_DEVICE=$(BOOT_DEVICE) \
          	$(if $(findstring ddr4,$(DDR_TYPE)),DRAM_USE_DDR4=1) \
          	all

          $(eval $(call BuildPackage/Trusted-Firmware-A))
          EOF

      - name: 4. 物理重置索引 (工序四)
        run: |
          cd openwrt
          rm -rf tmp
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 5. 物理注入 1024M 参数并生成配置 (工序五)
        run: |
          cd openwrt
          cat <<EOF > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y
          CONFIG_PACKAGE_trusted-firmware-a-mt7981-nor-ddr4=y
          CONFIG_PACKAGE_uboot-mediatek-mt7981_sl_3000-nor=y
          EOF
          make defconfig
          # 物理检查
          grep "CONFIG_PACKAGE_trusted-firmware-a-mt7981-nor-ddr4=y" .config

      - name: 6. 物理同步回 GitHub 仓库 (工序六 - 修复路径缺失)
        run: |
          git clone -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ykm888/66.git repo
          # 物理关键：递归创建目录，解决 "No such file or directory" 报错
          mkdir -p repo/package/boot/arm-trusted-firmware-mediatek/
          mkdir -p repo/custom-config/
          
          # 物理执行覆盖
          cp openwrt/.config repo/custom-config/sl3000.config
          cp openwrt/package/boot/arm-trusted-firmware-mediatek/Makefile repo/package/boot/arm-trusted-firmware-mediatek/Makefile
          
          cd repo
          git config user.name "SL3000-Final-Repair-Bot"
          git config user.email "bot@github.com"
          git add .
          git commit -m "fix: 物理修复 Makefile 路径并更新全量配置" || exit 0
          git push origin main
