name: "SL3000-1024M-Final-V23-Fixed"

on:
  workflow_dispatch:

jobs:
  generate-config:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理环境初始化
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential flex bison g++ gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig
          rm -rf openwrt
          # 物理锁定：拉取针对 1024M DDR4 调优的 bootstrap 分支
          git clone --depth 1 -b sl3000-immortalwrt-bootstrap https://github.com/ykm888/66 openwrt

      - name: 2. 物理注入 1024M 救砖核心 (完全采用 echo 注入)
        run: |
          cd openwrt
          
          # A. 物理注入 U-Boot Makefile (适配 P3A8GL4MLF-GJN 颗粒)
          UBOOT_MK="package/boot/uboot-mediatek/Makefile"
          mkdir -p $(dirname $UBOOT_MK)
          echo 'include $(TOPDIR)/rules.mk' > $UBOOT_MK
          echo 'include $(INCLUDE_DIR)/kernel.mk' >> $UBOOT_MK
          echo 'PKG_NAME:=uboot-mediatek' >> $UBOOT_MK
          echo 'PKG_VERSION:=2024.10' >> $UBOOT_MK
          echo 'PKG_RELEASE:=1' >> $UBOOT_MK
          echo 'PKG_SOURCE_PROTO:=git' >> $UBOOT_MK
          echo 'PKG_SOURCE_URL:=https://github.com/ykm888/66.git' >> $UBOOT_MK
          echo 'PKG_SOURCE_VERSION:=sl3000-uboot-base' >> $UBOOT_MK
          echo 'include $(INCLUDE_DIR)/u-boot.mk' >> $UBOOT_MK
          echo 'include $(INCLUDE_DIR)/package.mk' >> $UBOOT_MK
          echo 'define U-Boot/Default' >> $UBOOT_MK
          echo '  BUILD_TARGET:=mediatek' >> $UBOOT_MK
          echo '  UBOOT_IMAGE:=u-boot-mtk.bin' >> $UBOOT_MK
          echo '  HIDDEN:=1' >> $UBOOT_MK
          echo 'endef' >> $UBOOT_MK
          echo 'define U-Boot/mt7981_sl_3000-emmc' >> $UBOOT_MK
          echo '  NAME:=SL-3000 (DDR4-1024M-eMMC)' >> $UBOOT_MK
          echo '  BUILD_SUBTARGET:=filogic' >> $UBOOT_MK
          echo '  UBOOT_CONFIG:=mt7981_emmc' >> $UBOOT_MK
          echo '  UBOOT_IMAGE:=mt7981_sl_3000-emmc-u-boot.fip' >> $UBOOT_MK
          echo '  BL2_BOOTDEV:=emmc' >> $UBOOT_MK
          echo '  BL2_SOC:=mt7981' >> $UBOOT_MK
          echo '  BL2_DDRTYPE:=ddr4' >> $UBOOT_MK
          echo '  DEPENDS:=+trusted-firmware-a-mt7981-emmc-ddr4' >> $UBOOT_MK
          echo 'endef' >> $UBOOT_MK
          echo 'UBOOT_TARGETS := mt7981_sl_3000-emmc' >> $UBOOT_MK
          echo 'define Package/u-boot-mediatek/install' >> $UBOOT_MK
          echo $'\t''$(INSTALL_DIR) $(STAGING_DIR_IMAGE)' >> $UBOOT_MK
          echo $'\t''$(CP) $(PKG_BUILD_DIR)/$(UBOOT_IMAGE) $(STAGING_DIR_IMAGE)/' >> $UBOOT_MK
          echo $'\t''[ -f $(STAGING_DIR_IMAGE)/mt7981-emmc-ddr4-bl2.bin ] && $(CP) $(STAGING_DIR_IMAGE)/mt7981-emmc-ddr4-bl2.bin $(STAGING_DIR_IMAGE)/mt7981-emmc-ddr4-bl2.img' >> $UBOOT_MK
          echo 'endef' >> $UBOOT_MK
          echo '$(eval $(call BuildPackage/U-Boot))' >> $UBOOT_MK

          # B. 物理锁定 1024M 内存 DTS (路径对齐)
          DTS_FILE="target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-sl-3000-emmc.dts"
          mkdir -p $(dirname $DTS_FILE)
          echo '/dts-v1/;' > $DTS_FILE
          echo '#include "mt7981.dtsi"' >> $DTS_FILE
          echo '/ { model = "SL-3000 1024M Recovery"; compatible = "sl,3000-emmc", "mediatek,mt7981";' >> $DTS_FILE
          echo 'chosen { bootargs = "console=ttyS0,115200n1 loglevel=8 earlycon=uart8250,mmio32,0x11002000 root=PARTLABEL=production rootwait rootfstype=squashfs,f2fs"; };' >> $DTS_FILE
          echo 'memory { device_type = "memory"; reg = <0 0x40000000 0 0x40000000>; }; };' >> $DTS_FILE
          echo '&mmc0 { bus-width = <8>; cap-mmc-highspeed; mmc-hs200-1_8v; max-frequency = <200000000>; non-removable; status = "okay"; };' >> $DTS_FILE
          echo '&pio { mmc0_pins_default: mmc0-pins-default { mux { function = "flash"; groups = "emmc_45"; }; }; };' >> $DTS_FILE

          # C. 物理注入 Filogic MK (救砖布局对齐)
          IMAGE_MK="target/linux/mediatek/image/filogic.mk"
          echo 'KERNEL_LOADADDR := 0x48080000' > $IMAGE_MK
          echo 'define Build/mt7981-bl2' >> $IMAGE_MK
          echo $'\t''cat $(STAGING_DIR_IMAGE)/mt7981-$(1)-bl2.img >> $@' >> $IMAGE_MK
          echo 'endef' >> $IMAGE_MK
          echo 'define Build/mt7981-bl31-uboot' >> $IMAGE_MK
          echo $'\t''cat $(STAGING_DIR_IMAGE)/mt7981_$(1)-u-boot.fip >> $@' >> $IMAGE_MK
          echo 'endef' >> $IMAGE_MK
          echo 'define Build/mt798x-gpt' >> $IMAGE_MK
          echo $'\t''cp $@ $@.tmp 2>/dev/null || true' >> $IMAGE_MK
          echo $'\t''ptgen -g -o $@.tmp -a 1 -l 1024 -t 0x2e -N production -p $(CONFIG_TARGET_ROOTFS_PARTSIZE)M@64M' >> $IMAGE_MK
          echo $'\t''cat $@.tmp >> $@' >> $IMAGE_MK
          echo $'\t''rm $@.tmp' >> $IMAGE_MK
          echo 'endef' >> $IMAGE_MK
          echo 'define Device/sl_3000-emmc' >> $IMAGE_MK
          echo '  DEVICE_VENDOR := SL' >> $IMAGE_MK
          echo '  DEVICE_MODEL := 3000' >> $IMAGE_MK
          echo '  DEVICE_DTS := mt7981-sl-3000-emmc' >> $IMAGE_MK
          echo '  DEVICE_PACKAGES := kmod-mmc-mtk kmod-mt7531 kmod-mtk-hnat kmod-fs-f2fs kmod-usb3' >> $IMAGE_MK
          echo '  IMAGE/factory.bin := mt798x-gpt emmc | pad-to 17k | mt7981-bl2 emmc-ddr4 | pad-to 6656k | mt7981-bl31-uboot sl_3000-emmc | pad-to 64M | append-rootfs' >> $IMAGE_MK
          echo 'endef' >> $IMAGE_MK
          echo 'TARGET_DEVICES += sl_3000-emmc' >> $IMAGE_MK

      - name: 3. 物理修复 Feeds 与 全速网口配置锁定
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_sl_3000-emmc=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=512" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7531=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mtk-hnat=y" >> .config
          
          make defconfig

      - name: 4. 推送物理配置至仓库
        run: |
          git clone -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ykm888/66.git repo-main
          mkdir -p repo-main/custom-config/
          cp openwrt/.config repo-main/custom-config/sl3000.config
          cd repo-main
          git config --global user.email "bot@github.com"
          git config --global user.name "SL3000-Bot"
          git add custom-config/sl3000.config
          git diff --cached --exit-code || (git commit -m "chore: 物理对齐完成，更新 SL-3000 配置" && git push origin main)
