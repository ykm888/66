name: Sync Perfect ATF for SL3000

on:
  workflow_dispatch:

jobs:
  sync-task:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Your Repo
      uses: actions/checkout@v4

    - name: Clone Verified Source
      run: |
        # 物理克隆你确认过的这个 mtksoc 仓库和分支
        git clone https://github.com/mtk-openwrt/arm-trusted-firmware.git -b mtksoc atf-src
        cd atf-src
        
        # 物理验证关键文件是否存在
        if [ -f "plat/mediatek/mt7981/platform.mk" ]; then
          echo "SUCCESS: MT7981 platform config verified!"
        else
          echo "ERROR: File not found! Check branch name."
          exit 1
        fi
        
        # 同步子模块，补齐核心零件
        git submodule update --init --recursive

    - name: Push to atf-sl3000-base
      run: |
        cd atf-src
        git config --global user.email "bot@github.com"
        git config --global user.name "Arch-Sync-Bot"
        git remote add my-repo https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        # 强制推送到你指定的路径
        git push -f my-repo HEAD:atf-sl3000-base
