name: SL-3000 Final Cleanup & Physical Hardening

on:
  workflow_dispatch:

jobs:
  cleanup-and-harden:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🛡️ 物理环境初始化
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧹 物理清洗分支索引
        run: |
          # 建立孤儿分支，彻底断开历史遗留，实现物理清场
          git checkout --orphan temp-clean-branch
          git rm -rf .
          
      - name: 📦 拉取官方源码并创建物理文件夹
        run: |
          # 1. 创建并填充 u-boot 文件夹
          git clone --depth 1 https://github.com/mtk-openwrt/u-boot.git temp_u
          rm -rf temp_u/.git
          mkdir -p u-boot
          cp -rL temp_u/. u-boot/
          
          # 2. 创建并填充 atf 文件夹
          git clone --depth 1 https://github.com/mtk-openwrt/arm-trusted-firmware.git temp_a
          rm -rf temp_a/.git
          mkdir -p atf
          cp -rL temp_a/. atf/
          
          # 清理物理残留
          rm -rf temp_u temp_a

      - name: 🏗️ 注入物理补丁 (1MB 偏移硬化)
        run: |
          # 物理锁定 ATF 的 1MB 偏移逻辑
          ATF_DEF="atf/plat/mediatek/mt7981/include/platform_def.h"
          if [ -f "$ATF_DEF" ]; then
            sed -i '/MTK_FIP_BASE/d' $ATF_DEF
            sed -i '/#define BL33_BASE/i #define MTK_FIP_BASE (0x100000)\n#define MTK_FIP_MAX_SIZE (0x200000)' $ATF_DEF
          fi

      - name: 🚀 强制推送物理文件夹至仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add u-boot atf
          git commit -m "SL-3000: Official Source Recovery with Physical Hardening (u-boot & atf)"
          # 物理执行：将临时分支的内容强行覆盖到目标远程分支
          git push origin temp-clean-branch:sl3000-clean-source --force
