name: Ultimate Stable SL-3000 Sync

on:
  workflow_dispatch:

jobs:
  adapt-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Your Repo
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare Clean Branch
        run: |
          git checkout --orphan sl3000-official-source
          git rm -rf .
          mkdir -p u-boot ATF

      - name: Clone and Strip Git
        run: |
          git clone --depth 1 https://github.com/mtk-openwrt/u-boot.git temp_u
          rm -rf temp_u/.git && cp -r temp_u/. u-boot/
          git clone --depth 1 https://github.com/mtk-openwrt/arm-trusted-firmware.git temp_a
          rm -rf temp_a/.git && cp -r temp_a/. ATF/
          rm -rf temp_u temp_a

      - name: 🛠️ Create DTS (Using printf - No EOF)
        run: |
          # 物理创建 mt7981-sl3000.dts，避开 EOF
          DTS_FILE="u-boot/arch/arm/dts/mt7981-sl3000.dts"
          printf "/dts-v1/;\n" > $DTS_FILE
          printf "/ {\n" >> $DTS_FILE
          printf "  #address-cells = <1>;\n" >> $DTS_FILE
          printf "  #size-cells = <1>;\n" >> $DTS_FILE
          printf "  model = \"SL-3000 (NOR+EMMC)\";\n" >> $DTS_FILE
          printf "  compatible = \"mediatek,mt7981\";\n" >> $DTS_FILE
          printf "  chosen { stdout-path = &uart0; };\n" >> $DTS_FILE
          printf "  memory@40000000 { device_type = \"memory\"; reg = <0x40000000 0x20000000>; };\n" >> $DTS_FILE
          printf "  soc {\n" >> $DTS_FILE
          printf "    compatible = \"simple-bus\";\n" >> $DTS_FILE
          printf "    #address-cells = <1>;\n" >> $DTS_FILE
          printf "    #size-cells = <1>;\n" >> $DTS_FILE
          printf "    ranges;\n" >> $DTS_FILE
          printf "    uart0: serial@11002000 { compatible = \"mediatek,hsuart\"; reg = <0x11002000 0x400>; reg-shift = <2>; status = \"okay\"; };\n" >> $DTS_FILE
          printf "    mmc0: mmc@11230000 { compatible = \"mediatek,mt7981-mmc\"; reg = <0x11230000 0x1000\"; bus-width = <8>; cap-mmc-highspeed; status = \"okay\"; };\n" >> $DTS_FILE
          printf "  };\n" >> $DTS_FILE
          printf "};\n" >> $DTS_FILE

          # 在 Makefile 注册该文件
          echo "dtb-\$(CONFIG_TARGET_MT7981) += mt7981-sl3000.dtb" >> u-boot/arch/arm/dts/Makefile

      - name: 🛠️ Auto-Fix ATF & U-Boot (Using sed)
        run: |
          # 1. ATF 物理偏移修复 (1MB)
          ATF_DEF="ATF/plat/mediatek/mt7981/include/platform_def.h"
          sed -i '/#define BL33_BASE/a #define MTK_FIP_BASE (0x100000)\n#define MTK_FIP_MAX_SIZE (0x200000)' $ATF_DEF
          
          # 2. U-Boot 物理内存修复 (512MB)
          UBOOT_H="u-boot/include/configs/mt7981.h"
          if [ -f "$UBOOT_H" ]; then
            sed -i 's/0x10000000/0x20000000/g' $UBOOT_H
          fi

      - name: Force Push Adapted Source
        run: |
          git rm -r --cached u-boot ATF || echo "Already Clean"
          git add .
          git commit -m "Auto-Sync & Fixed SL-3000 Source (Standard IO)"
          git push origin sl3000-official-source --force
