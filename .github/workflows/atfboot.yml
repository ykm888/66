name: Auto Setup SL-3000 Branch

on:
  workflow_dispatch: # 手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    # 这一行确保脚本拥有 GITHUB_TOKEN 的写入能力
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4

      - name: Configure Git Global
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Create Branch
        run: |
          # 强制创建一个名为 sl3000-official-source 的干净分支
          git checkout --orphan sl3000-official-source
          git rm -rf . # 清空新分支内容，准备接收源码
          mkdir -p u-boot ATF

      - name: Pull MTK U-Boot Source
        run: |
          git clone --depth 1 https://github.com/mtk-openwrt/u-boot.git temp_u
          cp -r temp_u/. u-boot/
          rm -rf temp_u

      - name: Pull MTK ATF Source
        run: |
          git clone --depth 1 https://github.com/mtk-openwrt/arm-trusted-firmware.git temp_a
          cp -r temp_a/. ATF/
          rm -rf temp_a

      - name: Apply SL-3000 Fixes
        run: |
          # 修复 ATF 寻址偏移 (1MB)
          sed -i '/#define BL33_BASE/a \\n#define MTK_FIP_BASE (0x100000)\n#define MTK_FIP_MAX_SIZE (0x200000)' ATF/plat/mediatek/mt7981/include/platform_def.h
          # 修复 U-Boot 内存定义 (512MB)
          if [ -f "u-boot/include/configs/mt7981.h" ]; then
            sed -i 's/0x10000000/0x20000000/g' u-boot/include/configs/mt7981.h
          fi

      - name: Force Push to Branch
        run: |
          git add .
          git commit -m "Initial SL-3000 official source with auto-fixes"
          # 关键：强制推送到远程分支
          git push origin sl3000-official-source --force
