name: SL-3000 Final Cleanup & Physical Hardening

on:
  workflow_dispatch:

jobs:
  cleanup-and-harden:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🛡️ 环境准备
        uses: actions/checkout@v4

      - name: 🛠️ 工具安装
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential device-tree-compiler

      - name: 🧹 清洗仓库索引
        run: |
          git checkout --orphan sl3000-clean-source
          git rm -rf .
          
      - name: 📦 拉取并“去 Git 化”物理源码
        run: |
          # U-Boot
          git clone --depth 1 https://github.com/mtk-openwrt/u-boot.git temp_u
          rm -rf temp_u/.git
          mkdir -p u-boot && cp -rL temp_u/. u-boot/
          # ATF
          git clone --depth 1 https://github.com/mtk-openwrt/arm-trusted-firmware.git temp_a
          rm -rf temp_a/.git
          mkdir -p atf && cp -rL temp_a/. atf/
          rm -rf temp_u temp_a

      - name: 🏗️ 注入 SL-3000 物理零件与配置锁
        run: |
          # 1. 创建物理 DTS
          DTS="u-boot/arch/arm/dts/mt7981-sl3000.dts"
          printf "/dts-v1/;\n#include \"mt7981.dtsi\"\n/ {\n  model = \"SL-3000 (512MB RAM)\";\n  memory@40000000 {\n    device_type = \"memory\";\n    reg = <0x40000000 0x20000000>;\n  };\n  chosen { stdout-path = &uart0; };\n};\n&uart0 { status = \"okay\"; };\n&mmc0 { bus-width = <8>; cap-mmc-highspeed; non-removable; status = \"okay\"; };\n" > $DTS
          
          # 2. 【核心修改】只追加规则，不破坏原有 Makefile 结构
          # 这样可以确保顶层 Makefile 引用的所有变量都不丢失
          echo 'dtb-$(CONFIG_TARGET_MT7981) += mt7981-sl3000.dtb' >> u-boot/arch/arm/dts/Makefile
          
          # 3. 锁定 Defconfig 唯一路径
          DEFCONFIG="u-boot/configs/mt7981_nor_emmc_rfb_defconfig"
          sed -i 's/CONFIG_DEFAULT_DEVICE_TREE=.*/CONFIG_DEFAULT_DEVICE_TREE="mt7981-sl3000"/' $DEFCONFIG
          sed -i 's/CONFIG_OF_LIST=.*/CONFIG_OF_LIST="mt7981-sl3000"/' $DEFCONFIG

          # 4. 物理对齐头文件（核心补丁：防止 DTB 编译找不到头文件）
          # 将顶层头文件物理拷贝到 dts 目录下，确保 DTC 绝对能找到它们
          cp -rL u-boot/include/dt-bindings u-boot/arch/arm/dts/include/

          # 5. ATF 1MB 物理偏移硬化
          ATF_DEF="atf/plat/mediatek/mt7981/include/platform_def.h"
          sed -i '/MTK_FIP_BASE/d' $ATF_DEF
          sed -i '/#define BL33_BASE/i #define MTK_FIP_BASE (0x100000)\n#define MTK_FIP_MAX_SIZE (0x200000)' $ATF_DEF

      - name: 🔍 最终物理验证
        run: |
          cd u-boot
          make mt7981_nor_emmc_rfb_defconfig
          # 直接指定编译生成的物理文件名，绕过全局 dtbs 检查
          CROSS_COMPILE=aarch64-linux-gnu- make arch/arm/dts/mt7981-sl3000.dtb -j$(nproc)
          echo "✅ 物理零件产出验证通过！"

      - name: 🚀 强制推送物理文件夹
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "SL-3000: Hardened physical source, fixed Makefile logic"
          git push origin sl3000-clean-source --force
