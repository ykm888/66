name: SL-3000 Final Cleanup & Physical Hardening

on:
  workflow_dispatch:

jobs:
  cleanup-and-harden:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🛡️ 环境准备
        uses: actions/checkout@v4

      - name: 🛠️ 工具安装
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential device-tree-compiler

      - name: 🧹 清洗仓库索引
        run: |
          # 彻底清除旧的分支索引，创建全新的纯物理分支
          git checkout --orphan sl3000-clean-source
          git rm -rf .
          
      - name: 📦 拉取并“去 Git 化” U-Boot
        run: |
          git clone --depth 1 https://github.com/mtk-openwrt/u-boot.git temp_u
          rm -rf temp_u/.git
          mkdir -p u-boot
          cp -rL temp_u/. u-boot/
          rm -rf temp_u

      - name: 📦 拉取并“去 Git 化” ATF
        run: |
          git clone --depth 1 https://github.com/mtk-openwrt/arm-trusted-firmware.git temp_a
          rm -rf temp_a/.git
          mkdir -p atf
          cp -rL temp_a/. atf/
          rm -rf temp_a

      - name: ✂️ 极致精简 DTS 目录
        run: |
          cd u-boot/arch/arm/dts/
          # 仅保留核心 dtsi 和头文件目录
          mkdir -p .keep
          mv mt7981.dtsi include .keep/
          rm -rf *.dts *.dtsi Makefile
          mv .keep/* .
          rm -rf .keep
          echo "✅ 目录物理清空完成"

      - name: 🏗️ 注入 SL-3000 定义与物理 Makefile
        run: |
          # 1. 创建你的专属 DTS
          DTS="u-boot/arch/arm/dts/mt7981-sl3000.dts"
          printf "/dts-v1/;\n#include \"mt7981.dtsi\"\n/ {\n  model = \"SL-3000 (512MB RAM)\";\n  memory@40000000 {\n    device_type = \"memory\";\n    reg = <0x40000000 0x20000000>;\n  };\n  chosen { stdout-path = &uart0; };\n};\n&uart0 { status = \"okay\"; };\n&mmc0 { bus-width = <8>; cap-mmc-highspeed; non-removable; status = \"okay\"; };\n" > $DTS
          
          # 2. 【核心修复】重写物理 Makefile，彻底根除 mt7622 等干扰
          # 使用 dtb-y 强制包含，确保语法 100% 正确
          DTS_MAKEFILE="u-boot/arch/arm/dts/Makefile"
          echo 'dtb-$(CONFIG_TARGET_MT7981) += mt7981-sl3000.dtb' > $DTS_MAKEFILE
          echo 'targets += $(dtb-y)' >> $DTS_MAKEFILE
          echo 'obj-y += $(dtb-y)' >> $DTS_MAKEFILE
          echo 'clean-files := *.dtb' >> $DTS_MAKEFILE
          
          # 3. 【核心修复】强制修改 Defconfig 锁定唯一设备树
          DEFCONFIG="u-boot/configs/mt7981_nor_emmc_rfb_defconfig"
          sed -i 's/CONFIG_DEFAULT_DEVICE_TREE=.*/CONFIG_DEFAULT_DEVICE_TREE="mt7981-sl3000"/' $DEFCONFIG
          sed -i 's/CONFIG_OF_LIST=.*/CONFIG_OF_LIST="mt7981-sl3000"/' $DEFCONFIG

          # 4. 物理化头文件引用（防止 dtc 找不到 include）
          rm -rf u-boot/arch/arm/dts/include/dt-bindings
          mkdir -p u-boot/arch/arm/dts/include/dt-bindings
          cp -rL u-boot/include/dt-bindings/* u-boot/arch/arm/dts/include/dt-bindings/
          
          # 5. ATF 1MB 偏移补丁 (物理闭环)
          ATF_DEF="atf/plat/mediatek/mt7981/include/platform_def.h"
          sed -i '/MTK_FIP_BASE/d' $ATF_DEF
          sed -i '/#define BL33_BASE/i #define MTK_FIP_BASE (0x100000)\n#define MTK_FIP_MAX_SIZE (0x200000)' $ATF_DEF

      - name: 🔍 最终验证
        run: |
          cd u-boot
          make mt7981_nor_emmc_rfb_defconfig
          # 关键验证：只编译 DTBS，确保 Makefile 语法和文件路径无误
          CROSS_COMPILE=aarch64-linux-gnu- make dtbs -j$(nproc)
          echo "✅ 验证通过：物理 Makefile 工作正常"

      - name: 🚀 强制推送物理文件夹
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "SL-3000: Complete Physical Source Hardening"
          git push origin sl3000-clean-source --force
