name: SL-3000 Source Physical Fixer

on:
  workflow_dispatch:

jobs:
  fix-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🛠️ 安装验证工具
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu build-essential device-tree-compiler

      - name: 📦 物理化源码 (彻底斩断小箭头)
        run: |
          git checkout --orphan sl3000-clean-source
          git rm -rf .
          
          # 创建小写物理目录
          mkdir -p u-boot atf
          
          # 克隆并利用 -L 参数物理化拷贝内容
          git clone --depth 1 https://github.com/mtk-openwrt/u-boot.git temp_u
          cp -rL temp_u/. u-boot/  # 这一步会将 u-boot 内部所有链接转为真实文件
          
          git clone --depth 1 https://github.com/mtk-openwrt/arm-trusted-firmware.git temp_a
          cp -rL temp_a/. atf/    # 这一步会将 atf 内部所有链接转为真实文件
          
          rm -rf temp_u temp_a

          # 物理化 U-Boot 内部的设备树链接
          rm -rf u-boot/arch/arm/dts/include/dt-bindings
          mkdir -p u-boot/arch/arm/dts/include/dt-bindings
          cp -rL u-boot/include/dt-bindings/* u-boot/arch/arm/dts/include/dt-bindings/

      - name: 🏗️ 注入适配补丁
        run: |
          # ATF 1MB 偏移补丁
          ATF_DEF="atf/plat/mediatek/mt7981/include/platform_def.h"
          sed -i '/MTK_FIP_BASE/d' $ATF_DEF
          sed -i '/#define BL33_BASE/i #define MTK_FIP_BASE (0x100000)\n#define MTK_FIP_MAX_SIZE (0x200000)' $ATF_DEF
          
          # U-Boot 512MB RAM & 专属 DTS
          printf "/dts-v1/;\n#include \"mt7981.dtsi\"\n/ {\n  model = \"SL-3000 (512MB RAM)\";\n  memory@40000000 {\n    device_type = \"memory\";\n    reg = <0x40000000 0x20000000>;\n  };\n  chosen { stdout-path = &uart0; };\n};\n&uart0 { status = \"okay\"; };\n&mmc0 { bus-width = <8>; cap-mmc-highspeed; non-removable; status = \"okay\"; };\n" > u-boot/arch/arm/dts/mt7981-sl3000.dts
          
          # 修正配置与编译目标
          sed -i '/#ifndef __MT7981_H/a #define CFG_SYS_SDRAM_SIZE 0x20000000' u-boot/include/configs/mt7981.h
          sed -i '/dtb-$(CONFIG_TARGET_MT7981) +=/ s/$/ mt7981-sl3000.dtb/' u-boot/arch/arm/dts/Makefile
          sed -i 's/mt7981-nor-emmc-rfb/mt7981-sl3000/g' u-boot/configs/mt7981_nor_emmc_rfb_defconfig

      - name: 🔍 最终物理路径验证
        run: |
          cd u-boot
          make mt7981_nor_emmc_rfb_defconfig
          CROSS_COMPILE=aarch64-linux-gnu- make dtbs -j$(nproc)
          echo "✅ 验证通过：源码已完全去链接化并适配硬件！"

      - name: 🚀 推送至仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "SL-3000: Hardened physical source (no symlinks)"
          git push origin sl3000-clean-source --force
