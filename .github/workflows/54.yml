name: "SL3000-Create-New-Clean-Branch-V32"

on:
  workflow_dispatch:

jobs:
  create-branch:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理检出环境并拉取官方源码
        run: |
          # 物理隔离：从官方 ImmortalWrt 镜像拉取最纯净的代码
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git source-code
          cd source-code
          # 物理同步 Feeds，确保依赖 Makefile 完整
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 2. 物理注入 1024M 硬件补丁 (SL3000 专属)
        run: |
          cd source-code
          # 修改 DTS 以物理支持 1024M 内存
          DTS_PATH="target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-sl-3000-emmc.dts"
          mkdir -p $(dirname $DTS_PATH)
          cat <<EOF > $DTS_PATH
          /dts-v1/;
          #include "mt7981.dtsi"
          / { model = "SL-3000 1024M ImmortalWrt Clean"; compatible = "sl,3000-emmc", "mediatek,mt7981";
          memory { device_type = "memory"; reg = <0 0x40000000 0 0x40000000>; }; };
          EOF

      - name: 3. 物理初始化 .config 基准
        run: |
          cd source-code
          # 设定物理目标架构
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y" >> .config
          # 开启核心救砖功能
          echo "CONFIG_MTK_BOOT_PARTITION=y" >> .config
          echo "CONFIG_MTK_WEB_FAILSAFE=y" >> .config
          
          # 物理对齐依赖
          make defconfig || true

      - name: 4. 物理创建并推送新分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd source-code
          # 彻底切断官方 Git 历史，建立你自己的物理存档点
          rm -rf .git
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          git commit -m "feat(sl3000): 物理初始化 ImmortalWrt 纯净源分支 (1024M)"
          
          # 【核心操作】物理推送到一个全新的分支名
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git remote add origin "$REMOTE_URL"
          
          # 物理强制推送到 sl3000-immortalwrt-clean 分支
          git push -f origin master:refs/heads/sl3000-immortalwrt-clean
