name: "SL3000-Bootstrap-ForceUpdate-V44"

on:
  workflow_dispatch:

jobs:
  force-update:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 物理环境初始化
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential flex bison g++ gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig
          rm -rf source-code

      - name: 2. 物理拉取 23.05 (Kernel 5.4) 源码
        run: |
          git clone --depth 1 -b openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git source-code
          cd source-code
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 3. 物理覆盖注入 1024M DTS (对齐你提供的源码)
        run: |
          cd source-code
          DTS_PATH="target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-sl-3000-emmc.dts"
          mkdir -p $(dirname "$DTS_PATH")
          
          cat <<'EOF' > "$DTS_PATH"
          /dts-v1/;
          #include "mt7981.dtsi"
          / {
          	model = "SL-3000 eMMC 1024M bootstrap version";
          	compatible = "sl,3000-emmc", "mediatek,mt7981";
          	chosen {
          		bootargs = "console=ttyS0,115200n1 loglevel=8 earlycon=uart8250,mmio32,0x11002000 root=PARTLABEL=rootfs rootwait rootfstype=squashfs,f2fs";
          	};
          	aliases {
          		led-boot = &status_red_led;
          		led-failsafe = &status_red_led;
          		led-running = &status_green_led;
          		led-upgrade = &status_blue_led;
          	};
          	memory { reg = <0 0x40000000 0 0x40000000>; };
          	leds {
          		compatible = "gpio-leds";
          		status_red_led: led-0 { label = "red:status"; gpios = <&pio 10 GPIO_ACTIVE_LOW>; };
          		status_green_led: led-1 { label = "green:status"; gpios = <&pio 11 GPIO_ACTIVE_LOW>; };
          		status_blue_led: led-2 { label = "blue:status"; gpios = <&pio 12 GPIO_ACTIVE_LOW>; };
          	};
          	gpio-keys {
          		compatible = "gpio-keys";
          		reset { label = "reset"; linux,code = <KEY_RESTART>; gpios = <&pio 1 GPIO_ACTIVE_LOW>; };
          		mesh { label = "mesh"; gpios = <&pio 0 GPIO_ACTIVE_LOW>; linux,code = <BTN_9>; linux,input-type = <EV_SW>; };
          	};
          };
          &uart0 { status = "okay"; };
          &watchdog { status = "okay"; };
          &eth {
          	status = "okay";
          	gmac0: mac@0 { compatible = "mediatek,eth-mac"; reg = <0>; phy-mode = "2500base-x"; fixed-link { speed = <2500>; full-duplex; pause; }; };
          	gmac1: mac@1 { compatible = "mediatek,eth-mac"; reg = <1>; phy-mode = "2500base-x"; fixed-link { speed = <2500>; full-duplex; pause; }; };
          	mdio: mdio-bus {
          		#address-cells = <1>; #size-cells = <0>;
          		switch@0 {
          			compatible = "mediatek,mt7531"; reg = <31>; reset-gpios = <&pio 39 0>;
          			ports {
          				#address-cells = <1>; #size-cells = <0>;
          				port@0 { reg = <0>; label = "lan1"; };
          				port@1 { reg = <1>; label = "lan2"; };
          				port@2 { reg = <2>; label = "lan3"; };
          				port@3 { reg = <3>; label = "wan"; };
          				port@6 { reg = <6>; label = "cpu"; ethernet = <&gmac0>; phy-mode = "2500base-x"; fixed-link { speed = <2500>; full-duplex; pause; }; };
          			};
          		};
          	};
          };
          &hnat { mtketh-wan = "eth1"; mtketh-lan = "eth0"; mtketh-ppd = "eth1"; mtketh-max-gmac = <2>; status = "okay"; };
          &xhci { mediatek,u3p-dis-msk = <0x0>; phys = <&u2port0 PHY_TYPE_USB2>, <&u3port0 PHY_TYPE_USB3>; status = "okay"; };
          &mmc0 { bus-width = <8>; cap-mmc-highspeed; max-frequency = <52000000>; no-sd; no-sdio; non-removable; pinctrl-names = "default", "state_uhs"; pinctrl-0 = <&mmc0_pins_default>; pinctrl-1 = <&mmc0_pins_uhs>; vmmc-supply = <&reg_3p3v>; status = "okay"; };
          &pio { mmc0_pins_default: mmc0-pins-default { mux { function = "flash"; groups = "emmc_45"; }; }; mmc0_pins_uhs: mmc0-pins-uhs { mux { function = "flash"; groups = "emmc_45"; }; }; };
          EOF

      - name: 4. 物理注入对齐版 MK 配置 (120M 救砖锁定)
        run: |
          cd source-code
          cat <<'EOF' > target/linux/mediatek/image/filogic.mk
          # Copyright (C) 2021 MediaTek Inc.
          KERNEL_LOADADDR := 0x48080000
          MT7981_USB_PKGS := automount blkid blockdev fdisk kmod-nls-cp437 kmod-nls-iso8859-1 kmod-usb2 kmod-usb3 luci-app-usb-printer luci-i18n-usb-printer-zh-cn kmod-usb-net-rndis usbutils kmod-usb-net-qmi-wwan
          define Device/sl_3000-emmc
            DEVICE_VENDOR := SL
            DEVICE_MODEL := 3000
            DEVICE_VARIANT := eMMC-1024M-Recovery
            DEVICE_DTS := mt7981-sl-3000-emmc
            DEVICE_DTS_DIR := $(DTS_DIR)/mediatek
            SUPPORTED_DEVICES := sl,3000-emmc
            IMAGES := factory.bin sysupgrade.bin
            IMAGE_SIZE := 120M
            IMAGE/factory.bin := append-kernel | append-rootfs | pad-to $(IMAGE_SIZE)
            IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
            DEVICE_PACKAGES := $(MT7981_USB_PKGS) kmod-mmc-mtk mkf2fs e2fsprogs kmod-fs-f2fs kmod-fs-ext4 kmod-fs-vfat
          endef
          TARGET_DEVICES += sl_3000-emmc
          EOF

      - name: 5. 物理开启救砖全家桶构建选项
        run: |
          cd source-code
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y" >> .config
          # 救砖核心参数：Web 界面 + 分区锁定
          echo "CONFIG_MTK_BOOT_PARTITION=y" >> .config
          echo "CONFIG_MTK_WEB_FAILSAFE=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=120" >> .config
          make defconfig || true

      - name: 6. 物理覆盖推送到 sl3000-immortalwrt-bootstrap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd source-code
          rm -rf .git
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: 物理对齐 1024M DTS/MK 并强制刷新救砖全家桶环境"
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git remote add origin "$REMOTE_URL"
          # 物理强制覆盖目标分支
          git push -f origin master:refs/heads/sl3000-immortalwrt-bootstrap
